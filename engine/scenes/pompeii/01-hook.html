<!-- hygen scene pompeii/01-hook: ported from examples/pompeii-short (state of the final render). Times in the script are REFERENCE times; the build warps them onto the current voice (engine/scenes/_runtime/warp.js). -->
<template id="f01-hook-template">
  <div id="root" data-composition-id="01-hook" data-duration="{{hygen:duration}}" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:"Cormorant Garamond";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/CormorantGaramond-500.woff2") format("woff2");}
      @font-face{font-family:"Cormorant Garamond";font-weight:600;font-style:normal;font-display:block;src:url("assets/fonts/CormorantGaramond-600.woff2") format("woff2");}
      @font-face{font-family:"Cormorant Garamond";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/CormorantGaramond-700.woff2") format("woff2");}
      @font-face{font-family:"Inter";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Inter-400.woff2") format("woff2");}
      @font-face{font-family:"Inter";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/Inter-500.woff2") format("woff2");}
      @font-face{font-family:"Inter";font-weight:600;font-style:normal;font-display:block;src:url("assets/fonts/Inter-600.woff2") format("woff2");}
      @font-face{font-family:"Inter";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/Inter-700.woff2") format("woff2");}
      @font-face{font-family:"Inter";font-weight:800;font-style:normal;font-display:block;src:url("assets/fonts/Inter-800.woff2") format("woff2");}

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* Ground: night, full-bleed, full-duration clip (never on #root). */
      #f01-hook-bg {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        z-index: 0;
        background-color: #0A0A09;
      }

      /* Camera: wraps every content element; transform written by one onUpdate writer. */
      #f01-hook-world {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        z-index: 1;
        transform-origin: 50% 50%;
      }

      /* Supporting glow behind the digits (centre 540,720). Outer = bloom/collapse, core = breathe. */
      #f01-hook-glow {
        position: absolute;
        left: 20px;
        top: 260px;
        width: 1040px;
        height: 920px;
        z-index: 1;
        transform-origin: 50% 50%;
      }
      #f01-hook-glow-core {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        background: radial-gradient(closest-side, rgba(255,90,31,1) 0%, rgba(255,90,31,0.6) 28%, rgba(255,90,31,0.24) 58%, rgba(255,90,31,0.07) 82%, rgba(255,90,31,0) 100%);
      }

      /* The smouldering spark: ember-deep dot r=6 with a soft halo (≤ 0.25 before ignition). */
      #f01-hook-halo {
        position: absolute;
        left: 460px;
        top: 640px;
        width: 160px;
        height: 160px;
        z-index: 2;
        transform-origin: 50% 50%;
        background: radial-gradient(closest-side, rgba(255,90,31,1) 0%, rgba(255,90,31,0.5) 38%, rgba(255,90,31,0.14) 70%, rgba(255,90,31,0) 100%);
      }
      #f01-hook-spark {
        position: absolute;
        left: 534px;
        top: 714px;
        width: 12px;
        height: 12px;
        z-index: 3;
        border-radius: 50%;
        background-color: #7A2208;
      }

      /* Hero counter «18»: display 560/600, lining tabular figures, fixed 2-digit box.
         Box is offset so the ink of «18» centres on x 540; digit optical centre ≈ y 720. */
      #f01-hook-counter {
        position: absolute;
        left: 257.8px;
        top: 479px;
        width: 528px;
        height: 480px;
        z-index: 4;
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        font-size: 560px;
        line-height: 480px;
        letter-spacing: -0.02em;
        font-variant-numeric: lining-nums tabular-nums;
        text-align: center;
        white-space: nowrap;
        color: #FF5A1F;
        transform-origin: 282.2px 241px;
      }

      /* Supporting title «ЧАСОВ»: 120/600 caps, bone; cap top ≈ y 1030.
         text-indent mirrors letter-spacing so the tracked word stays optically centred. */
      #f01-hook-unit {
        position: absolute;
        left: 0;
        top: 1009px;
        width: 1080px;
        height: 120px;
        box-sizing: border-box;
        padding-left: 6px;
        z-index: 4;
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        font-size: 120px;
        line-height: 120px;
        letter-spacing: 0.28em;
        text-indent: 0.28em;
        text-transform: uppercase;
        text-align: center;
        white-space: nowrap;
        color: #ECE7DE;
      }
      /* per-glyph boxes so the tracking convergence moves on x (transform) — never letter-spacing */
      .f01-hook-ch {
        display: inline-block;
      }
    </style>

    <div id="f01-hook-bg" class="clip" data-start="0" data-duration="{{hygen:duration}}" data-track-index="0"></div>

    <div id="f01-hook-world">
      <div id="f01-hook-glow"><div id="f01-hook-glow-core"></div></div>
      <div id="f01-hook-halo"></div>
      <div id="f01-hook-spark"></div>
      <!-- the 560px figure's line box (font ascent/descent) reaches the title's box; the inked digits end ≈ y 895, the title starts at 1009 -->
      <div id="f01-hook-counter" data-layout-allow-overlap="">18</div>
      <div id="f01-hook-unit"><span class="f01-hook-ch">H</span><span class="f01-hook-ch">O</span><span class="f01-hook-ch">U</span><span class="f01-hook-ch">R</span><span class="f01-hook-ch">S</span></div>
    </div>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var DURATION = 3.721;
        var EMBER_DEEP = "#7A2208";
        var EMBER = "#FF5A1F";
        // cooled ash: ash-light keeps the held grey «18» readable on night (≈5.5:1)
        var ASH_COOL = "#8C877F";
        var BONE = "#ECE7DE";
        var SMOKE = "#A39E95";
        var GLOW_PEAK = 0.4;

        var world = document.getElementById("f01-hook-world");
        var glow = document.getElementById("f01-hook-glow");
        var glowCore = document.getElementById("f01-hook-glow-core");
        var halo = document.getElementById("f01-hook-halo");
        var spark = document.getElementById("f01-hook-spark");
        var counter = document.getElementById("f01-hook-counter");
        var unit = document.getElementById("f01-hook-unit");

        var tl = gsap.timeline({ paused: true });
  /*{{hygen:warp}}*/

        // Continuation segment of a value-continuous chain: explicit from/to, never immediate-rendered,
        // so every state is a pure function of timeline time under any seek order.
        function seg(target, fromVars, toVars, at, dur, ease) {
          toVars.duration = dur;
          toVars.ease = ease;
          toVars.immediateRender = false;
          tl.fromTo(target, fromVars, toVars, at);
        }

        // ── Camera (multi-phase-camera): steady push 1.00 → 1.0404 (linear, 0–2.71s), then a
        //    velocity-matched settle 1.0404 → 1.05 (sine.out) on the cooling beat; Lissajous micro-drift
        //    (3px / 2px, ratio 1.3) composed in the single writer of world.style.transform.
        var cam = { s: 1 };
        var drift = { p: 0 };
        tl.fromTo(cam, { s: 1 }, { s: 1.0404, duration: 2.71, ease: "none" }, 0);
        seg(cam, { s: 1.0404 }, { s: 1.05 }, 2.71, DURATION - 2.71, "sine.out");
        tl.fromTo(drift, { p: 0 }, {
          p: Math.PI * 2,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            var dx = Math.sin(drift.p) * 3;
            var dy = Math.sin(drift.p * 1.3) * 2;
            world.style.transform = "scale(" + cam.s.toFixed(5) + ") translate(" + dx.toFixed(3) + "px, " + dy.toFixed(3) + "px)";
          }
        }, 0);

        // ── Scene 1 (0.00–0.42): the spark barely smoulders, gathering toward the word.
        tl.fromTo(halo, { opacity: 0.1, scale: 0.9 }, { opacity: 0.22, scale: 1, duration: 0.2, ease: "sine.inOut" }, 0);
        seg(halo, { opacity: 0.22, scale: 1 }, { opacity: 0.16, scale: 0.96 }, 0.2, 0.11, "sine.inOut");
        seg(halo, { opacity: 0.16, scale: 0.96 }, { opacity: 0.25, scale: 1 }, 0.31, 0.12, "sine.in");
        tl.fromTo(spark, { opacity: 0.65, scale: 1 }, { opacity: 0.95, scale: 1, duration: 0.2, ease: "sine.inOut" }, 0);
        seg(spark, { opacity: 0.95 }, { opacity: 0.8 }, 0.2, 0.11, "sine.inOut");
        seg(spark, { opacity: 0.8 }, { opacity: 1 }, 0.31, 0.12, "sine.in");

        // ── Scene 2 (0.43–1.30): «восемнадцать» — the number ignites.
        // counting-dynamic-scale: value 0 → 18 and scale 0.55 → 1 share position, duration and ease.
        // one stable baseline for every counter channel, then non-immediate tweens (seek-safe both ways)
        tl.set(counter, { opacity: 0, innerText: 0, scale: 0.55, color: EMBER_DEEP, filter: "brightness(1)" }, 0);
        tl.fromTo(counter, { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "power1.out", immediateRender: false }, 0.43);
        tl.fromTo(counter, { innerText: 0 }, { innerText: 18, snap: { innerText: 1 }, duration: 0.85, ease: "expo.out", immediateRender: false }, 0.43);
        tl.fromTo(counter, { scale: 0.55 }, { scale: 1, duration: 0.85, ease: "expo.out", immediateRender: false }, 0.43);
        tl.fromTo(counter, { color: EMBER_DEEP }, { color: EMBER, duration: 0.85, ease: "power2.out", immediateRender: false }, 0.43);

        // Two short deterministic brightness flashes in the first 0.25s (a coal catching).
        tl.fromTo(counter, { filter: "brightness(1)" }, { filter: "brightness(2)", duration: 0.03, ease: "power1.out", immediateRender: false }, 0.43);
        seg(counter, { filter: "brightness(2)" }, { filter: "brightness(1.05)" }, 0.46, 0.08, "power2.out");
        seg(counter, { filter: "brightness(1.05)" }, { filter: "brightness(1.8)" }, 0.55, 0.03, "power1.out");
        seg(counter, { filter: "brightness(1.8)" }, { filter: "brightness(1)" }, 0.58, 0.1, "power2.out");

        // The spark flares with the flashes and goes out inside the number.
        seg(halo, { opacity: 0.25, scale: 1 }, { opacity: 0.34, scale: 1.8 }, 0.43, 0.03, "power1.out");
        seg(halo, { opacity: 0.34, scale: 1.8 }, { opacity: 0.12, scale: 2 }, 0.46, 0.08, "power2.out");
        seg(halo, { opacity: 0.12, scale: 2 }, { opacity: 0.3, scale: 2.3 }, 0.55, 0.03, "power1.out");
        seg(halo, { opacity: 0.3, scale: 2.3 }, { opacity: 0, scale: 2.6 }, 0.58, 0.22, "power2.out");
        seg(spark, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.5 }, 0.43, 0.28, "power2.in");

        // ambient-glow-bloom (hero bloom): 0 → 0.40 behind the digits, landing with the count (1.28s).
        tl.fromTo(glow, { opacity: 0, scale: 0.85 }, { opacity: GLOW_PEAK, scale: 1, duration: 0.85, ease: "power2.out" }, 0.43);

        // ── Scene 3 (1.04–1.60): «часов» — tracking converges 0.6em → 0.28em. The static layout holds the
        //    final 0.28em; each glyph starts spread by the extra 0.32em per step and travels on x.
        var chars = unit.querySelectorAll(".f01-hook-ch");
        var SPREAD = 0.32 * 120;
        for (var ci = 0; ci < chars.length; ci++) {
          var off = (ci - (chars.length - 1) / 2) * SPREAD;
          tl.fromTo(chars[ci], { x: off, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 1.04);
        }

        // ── Scene 4 (1.60–2.70): hold. Bounded breathe of the glow, ±6% of peak (one finite curve).
        seg(glow, { opacity: GLOW_PEAK }, { opacity: 0.424 }, 1.6, 0.275, "sine.inOut");
        seg(glow, { opacity: 0.424 }, { opacity: 0.376 }, 1.875, 0.55, "sine.inOut");
        seg(glow, { opacity: 0.376 }, { opacity: GLOW_PEAK }, 2.425, 0.275, "sine.inOut");
        tl.fromTo(glowCore, { scale: 1 }, { scale: 1.015, duration: 0.275, ease: "sine.inOut" }, 1.6);
        seg(glowCore, { scale: 1.015 }, { scale: 0.985 }, 1.875, 0.55, "sine.inOut");
        seg(glowCore, { scale: 0.985 }, { scale: 1 }, 2.425, 0.275, "sine.inOut");

        // ── Scene 5 (2.71–3.721): «перестал существовать» — the heat dies; grey «18 ЧАСОВ» holds.
        seg(counter, { color: EMBER }, { color: ASH_COOL }, 2.71, 1, "power2.inOut");
        seg(unit, { color: BONE }, { color: SMOKE }, 2.71, 1, "power2.inOut");
        seg(glow, { opacity: GLOW_PEAK, scale: 1 }, { opacity: 0, scale: 0.7 }, 2.71, 1, "power2.inOut");

        W.apply(tl);
  window.__timelines["01-hook"] = tl;
      })();
    </script>
  </div>
</template>
