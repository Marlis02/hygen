  }
  var pxA = new Float32Array(NP), pyA = new Float32Array(NP), pOn = new Uint8Array(NP);
  function drawPumice(t) {
    var any = false, q;
    for (q = 0; q < NP; q++) {
      pOn[q] = 0;
      var ap = t - pSt[q];
      if (ap < 0) continue;
      var cyc = ap / pL[q], n = Math.floor(cyc), ph = cyc - n;
      var y = -40 + ph * 2000;
      var x0 = pX0[q] + ((n * 397) % 1640);
      if (x0 > 1600) x0 -= 1640;
      var x = x0 - 0.26 * (y + 40) + 5 * Math.sin(ph * 9.4 + pPh[q]);
      if (x < -30 || x > 1110) continue;
      pxA[q] = x; pyA[q] = y; pOn[q] = 1; any = true;
    }
    if (!any) return;
    ctx.strokeStyle = ASH_LIGHT; ctx.fillStyle = ASH_LIGHT; ctx.lineCap = "round";
    for (var pass = 0; pass < 2; pass++) {
      var big = pass === 1;
      ctx.globalAlpha = 0.22;
      ctx.lineWidth = big ? 3.4 : 2.2;
      ctx.beginPath();
      for (q = 0; q < NP; q++) {
        if (!pOn[q] || (pR[q] > 2.6) !== big) continue;
        ctx.moveTo(pxA[q], pyA[q]);
        ctx.lineTo(pxA[q] + 1.17 * pR[q], pyA[q] - 4.5 * pR[q]);
      }
      ctx.stroke();
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      for (q = 0; q < NP; q++) {
        if (!pOn[q] || (pR[q] > 2.6) !== big) continue;
        ctx.moveTo(pxA[q] + pR[q], pyA[q]);
        ctx.arc(pxA[q], pyA[q], pR[q], 0, TAU);
      }
      ctx.fill();
    }
  }
  // altitude marker + readout: same function as the drawn column top, so they cannot drift apart
  var lastAlt = -1;
  function hud(t) {
    var e = riseE(t - T_ERUPT);
    var hpx = HTOP * e;
    marker.style.transform = "translateY(" + (-hpx).toFixed(2) + "px)";
    readout.style.transform = "translateY(" + (-hpx).toFixed(2) + "px) scale(" + (0.62 + 0.38 * e).toFixed(4) + ")";
    var v = Math.round(30 * e);
    if (v !== lastAlt) { altEl.textContent = String(v); lastAlt = v; }
  }
  function render(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(canvas.width / 1080, 0, 0, canvas.height / 1920, 0, 0);
    drawGlow(t);
    drawWisps(t);
    drawColumn(t);
    drawSparks(t);
    drawDust(t);
    drawPumice(t);
    ctx.globalAlpha = 1;
    hud(t);
  }

  // ---- multi-phase camera: phase scale + sine drift + impact rumble, one writer, pure function of t ----
  var eOut = gsap.parseEase("power2.out"), eInOut = gsap.parseEase("power2.inOut");
  function camScale(t) {
    if (t < 1.8) return 1.015 - 0.015 * eOut(t / 1.8);           // settle after the cut
    if (t < 5.08) return 1;                                       // neutral while the column climbs the scale
    if (t < 7.68) return 1 + 0.012 * eInOut((t - 5.08) / 2.6);   // slow push as the pumice falls
    if (t < 8.24) return 1.012;
    return 1.012 + 0.013 * eOut(clamp01((t - 8.24) / 1.3));      // push on the collapse
  }
  function writeCamera(t) {
    var s = camScale(t);
    var p = TAU * 1.5 * (t / DUR);
    var dx = 4 * Math.sin(p), dy = 2 * Math.sin(p * 1.3);
    for (var j = 0; j < 7; j++) {
      var d = t - (8.59 + 0.07 * j);
      if (d <= 0) continue;
      var env = 1.4 * Math.exp(-d / 0.16);
      dx += env * Math.sin(d * 57 + j * 1.7);
      dy += env * 0.8 * Math.sin(d * 44 + j * 2.3 + 1);
    }
    var ty = 810 * (1 - 1 / s);                                   // pins y 150: the date and the 30 KM readout never rise
    camera.style.transform = "scale(" + s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px, " + (ty + dy).toFixed(2) + "px)";
  }

  // ---- timeline ----
  var tl = gsap.timeline({ paused: true });
  /*{{hygen:warp}}*/
  var clock = { t: 0 };
  tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(W.ref(clock.t)); } }, 0);
  var drift = { t: 0 };
  tl.fromTo(drift, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { writeCamera(W.ref(drift.t)); } }, 0);

  // Scene 1: 79 counts up on "Семьдесят девятый", Н. Э. on "эры"
  // property tween (not onUpdate): a seek that lands past its end still writes 79
  tl.fromTo(yearEl, { textContent: 0 }, { textContent: 79, snap: { textContent: 1 }, duration: 1, ease: "power2.out" }, 0.2);
  tl.fromTo(yearEl, { scale: 0.55 }, { scale: 1, duration: 1, ease: "power2.out" }, 0.2);
  tl.fromTo(eraEl, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 1.54);

  // Scene 2: axis draws on "Везувий", marker + readout ride the column top, sky darkens
  tl.fromTo(axis, { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out" }, T_ERUPT);
  tl.fromTo(ticks, { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power2.out", stagger: 0.055 }, T_ERUPT + 0.02);
  tl.fromTo([marker, readout], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, T_ERUPT);
  tl.fromTo(sky, { opacity: 0 }, { opacity: 0.5, duration: 2.2, ease: "power1.inOut" }, T_ERUPT);

  // Scene 4: ПЕМЗА wipes in on "пемза"; pumice layers grow on every roof from "по нескольку"
  tl.fromTo(wordEl, { clipPath: "inset(-30% 100% -30% -4%)" }, { clipPath: "inset(-30% -8% -30% -4%)", duration: 0.5, ease: "power2.inOut" }, 5.89);
  var layer = { p: 0 };
  tl.fromTo(layer, { p: 0 }, { p: 1, duration: 1.75, ease: "power1.inOut", onUpdate: function () {
    var sy = "scale(1 " + layer.p.toFixed(4) + ")";
    for (var k = 0; k < strips.length; k++) strips[k].setAttribute("transform", sy);
  } }, 6.45);

  // Scene 5: roofs give way left to right (0.07 s step): halves drop 26 px, rotate ±10°, then hold
  roofs.forEach(function (rf) {
    var st = { p: 0 };
    tl.fromTo(st, { p: 0 }, { p: 1, duration: 0.35, ease: "power2.in", onUpdate: function () {
      var dy = (26 * st.p).toFixed(2), ang = 10 * st.p;
      rf.left.setAttribute("transform", "translate(0 " + dy + ") rotate(" + ang.toFixed(3) + " " + rf.lx + " " + rf.e + ")");
      rf.right.setAttribute("transform", "translate(0 " + dy + ") rotate(" + (-ang).toFixed(3) + " " + rf.rx + " " + rf.e + ")");
    } }, rf.at);
  });

  render(0);
  writeCamera(0);
  window.__timelines = window.__timelines || {};
  W.apply(tl);
  window.__timelines["03-eruption"] = tl;
})();
</script>
</template>
