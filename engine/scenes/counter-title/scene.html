<!-- hygen scene counter-title (from Pompeii 01-hook). Times in the script are REFERENCE times; the build warps them onto the current voice. Contract: engine/scenes/CONTRACT.md -->
<template id="__p__-template">
  <div id="root" data-composition-id="__cid__" data-duration="{{hygen:duration}}" data-width="1080" data-height="1920">
    <style>
      {{hygen:fontfaces}}

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* Ground: night, full-bleed, full-duration clip (never on #root). */
      #__p__-bg {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        z-index: 0;
        background-color: {{hygen:color.night}};
      }

      /* Camera: wraps every content element; transform written by one onUpdate writer. */
      #__p__-world {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        z-index: 1;
        transform-origin: 50% 50%;
      }

      /* Supporting glow behind the digits (centre 540,720). Outer = bloom/collapse, core = breathe. */
      #__p__-glow {
        position: absolute;
        left: 20px;
        top: 260px;
        width: 1040px;
        height: 920px;
        z-index: 1;
        transform-origin: 50% 50%;
      }
      #__p__-glow-core {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        background: radial-gradient(closest-side, rgba({{hygen:rgb.hero}},1) 0%, rgba({{hygen:rgb.hero}},0.6) 28%, rgba({{hygen:rgb.hero}},0.24) 58%, rgba({{hygen:rgb.hero}},0.07) 82%, rgba({{hygen:rgb.hero}},0) 100%);
      }

      /* The smouldering spark: hero-deep dot r=6 with a soft halo (≤ 0.25 before ignition). */
      #__p__-halo {
        position: absolute;
        left: 460px;
        top: 640px;
        width: 160px;
        height: 160px;
        z-index: 2;
        transform-origin: 50% 50%;
        background: radial-gradient(closest-side, rgba({{hygen:rgb.hero}},1) 0%, rgba({{hygen:rgb.hero}},0.5) 38%, rgba({{hygen:rgb.hero}},0.14) 70%, rgba({{hygen:rgb.hero}},0) 100%);
      }
      #__p__-spark {
        position: absolute;
        left: 534px;
        top: 714px;
        width: 12px;
        height: 12px;
        z-index: 3;
        border-radius: 50%;
        background-color: {{hygen:color.heroDeep}};
      }

      /* Hero counter: display 560/600, lining tabular figures. The box spans the frame and is shifted by the
         measured ink offset of «18» (−18.2 px at 560 px) so the digits centre on x 540; long values shrink to fit. */
      #__p__-counter {
        position: absolute;
        left: -18.2px;
        top: 479px;
        width: 1080px;
        height: 480px;
        z-index: 4;
        font-family: {{hygen:font.display}};
        font-weight: 600;
        font-size: {{hygen:size.display}}px;
        line-height: 480px;
        letter-spacing: -0.02em;
        font-variant-numeric: lining-nums tabular-nums;
        text-align: center;
        white-space: nowrap;
        color: {{hygen:color.hero}};
        transform-origin: 558.2px 241px;
      }

      /* Unit title: 120/600 caps, bone; cap top ≈ y 1030.
         text-indent mirrors letter-spacing so the tracked word stays optically centred. */
      #__p__-unit {
        position: absolute;
        left: 0;
        top: 1009px;
        width: 1080px;
        height: 120px;
        box-sizing: border-box;
        padding-left: 6px;
        z-index: 4;
        font-family: {{hygen:font.display}};
        font-weight: 600;
        font-size: {{hygen:size.headline}}px;
        line-height: 120px;
        letter-spacing: 0.28em;
        text-indent: 0.28em;
        text-transform: uppercase;
        text-align: center;
        white-space: nowrap;
        color: {{hygen:color.text}};
      }
      /* per-glyph boxes so the tracking convergence moves on x (transform) — never letter-spacing */
      .__p__-ch {
        display: inline-block;
      }
    </style>

    <div id="__p__-bg" class="clip" data-start="0" data-duration="{{hygen:duration}}" data-track-index="0"></div>

    <div id="__p__-world">
      <div id="__p__-glow"><div id="__p__-glow-core"></div></div>
      <div id="__p__-halo"></div>
      <div id="__p__-spark"></div>
      <!-- the 560px figure's line box (font ascent/descent) reaches the title's box; the inked digits end ≈ y 895, the title starts at 1009 -->
      <div id="__p__-counter" data-layout-allow-overlap="">0</div>
      <div id="__p__-unit"></div>
    </div>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        /*{{hygen:params}}*/
        window.__timelines = window.__timelines || {};

        var DURATION = 3.721;
        var HERO_DEEP = S.colors.heroDeep;
        var HERO = S.colors.hero;
        // cooled ash: ash-light keeps the held grey number readable on night (≈5.5:1)
        var ASH_COOL = S.colors.ashLight;
        var BONE = S.colors.text;
        var SMOKE = S.colors.muted;
        var GLOW_PEAK = 0.4;
        var BURN = P.heat !== "none";
        var COOL = P.heat === "burn-cool";

        var world = document.getElementById("__p__-world");
        var glow = document.getElementById("__p__-glow");
        var glowCore = document.getElementById("__p__-glow-core");
        var halo = document.getElementById("__p__-halo");
        var spark = document.getElementById("__p__-spark");
        var counter = document.getElementById("__p__-counter");
        var unit = document.getElementById("__p__-unit");

        // ── value formatting and fit: advance estimate in em (tabular lining digits ≈ 0.5, separators ≈ 0.25),
        //    deterministic — no text measuring before the fonts load. «18» = 1.0 em → 560 px, unchanged.
        function fmt(n) {
          n = Math.round(n);
          if (P.format === "clock") {
            var m = n % 60;
            return Math.floor(n / 60) + ":" + (m < 10 ? "0" : "") + m;
          }
          if (P.format === "thousands") return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          return String(n);
        }
        var finalText = fmt(P.value);
        var em = 0;
        for (var fi = 0; fi < finalText.length; fi++) em += /\d/.test(finalText[fi]) ? 0.5 : 0.25;
        var fontPx = Math.min(S.sizes.display, 900 / Math.max(em, 0.5));
        counter.style.fontSize = fontPx.toFixed(1) + "px";

        var letters = String(P.unit).split("");
        var unitPx = 120 * Math.min(1, 6 / Math.max(letters.length, 1));
        unit.style.fontSize = unitPx.toFixed(1) + "px";
        for (var li = 0; li < letters.length; li++) {
          var span = document.createElement("span");
          span.className = "__p__-ch";
          span.textContent = letters[li];
          unit.appendChild(span);
        }

        var tl = gsap.timeline({ paused: true });
  /*{{hygen:warp}}*/

        // Continuation segment of a value-continuous chain: explicit from/to, never immediate-rendered,
        // so every state is a pure function of timeline time under any seek order.
        function seg(target, fromVars, toVars, at, dur, ease) {
          toVars.duration = dur;
          toVars.ease = ease;
          toVars.immediateRender = false;
          tl.fromTo(target, fromVars, toVars, at);
        }

        // ── Camera (multi-phase-camera): steady push 1.00 → 1.0404 (linear, 0–2.71s), then a
        //    velocity-matched settle 1.0404 → 1.05 (sine.out) on the cooling beat; Lissajous micro-drift
        //    (3px / 2px, ratio 1.3) composed in the single writer of world.style.transform.
        var cam = { s: 1 };
        var drift = { p: 0 };
        tl.fromTo(cam, { s: 1 }, { s: 1.0404, duration: 2.71, ease: "none" }, 0);
        seg(cam, { s: 1.0404 }, { s: 1.05 }, 2.71, DURATION - 2.71, "sine.out");

        // The count is written from the same full-span driver as the camera (TRAPS: a short onUpdate tween
        // freezes). Progress runs in ACTUAL time between the warped start and end, like a plain tween would.
        var COUNT_AT = 0.43, COUNT_DUR = 0.85;
        var easeCount = gsap.parseEase("expo.out");
        var shown = "";
        function writeCount(refT) {
          var a0 = W.at(COUNT_AT), a1 = W.at(COUNT_AT + COUNT_DUR), tAct = W.at(refT);
          var p = Math.min(1, Math.max(0, (tAct - a0) / (a1 - a0)));
          var text = fmt(P.value * easeCount(p));
          if (text !== shown) {
            counter.textContent = text;
            shown = text;
          }
        }
        writeCount(0);
        tl.fromTo(drift, { p: 0 }, {
          p: Math.PI * 2,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            var dx = Math.sin(drift.p) * 3;
            var dy = Math.sin(drift.p * 1.3) * 2;
            world.style.transform = "scale(" + cam.s.toFixed(5) + ") translate(" + dx.toFixed(3) + "px, " + dy.toFixed(3) + "px)";
            writeCount(W.ref((drift.p / (Math.PI * 2)) * DURATION));
          }
        }, 0);

        // ── Scene 1 (0.00–0.42): the spark barely smoulders, gathering toward the word.
        if (BURN) {
          tl.fromTo(halo, { opacity: 0.1, scale: 0.9 }, { opacity: 0.22, scale: 1, duration: 0.2, ease: "sine.inOut" }, 0);
          seg(halo, { opacity: 0.22, scale: 1 }, { opacity: 0.16, scale: 0.96 }, 0.2, 0.11, "sine.inOut");
          seg(halo, { opacity: 0.16, scale: 0.96 }, { opacity: 0.25, scale: 1 }, 0.31, 0.12, "sine.in");
          tl.fromTo(spark, { opacity: 0.65, scale: 1 }, { opacity: 0.95, scale: 1, duration: 0.2, ease: "sine.inOut" }, 0);
          seg(spark, { opacity: 0.95 }, { opacity: 0.8 }, 0.2, 0.11, "sine.inOut");
          seg(spark, { opacity: 0.8 }, { opacity: 1 }, 0.31, 0.12, "sine.in");
        } else {
          tl.set([halo, spark, glow], { opacity: 0 }, 0);
        }

        // ── Scene 2 (0.43–1.30): the number ignites.
        // counting-dynamic-scale: value (driver) and scale 0.55 → 1 share position, duration and ease.
        var START_COLOR = BURN ? HERO_DEEP : BONE;
        var END_COLOR = BURN ? HERO : BONE;
        tl.set(counter, { opacity: 0, scale: 0.55, color: START_COLOR, filter: "brightness(1)" }, 0);
        tl.fromTo(counter, { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "power1.out", immediateRender: false }, 0.43);
        tl.fromTo(counter, { scale: 0.55 }, { scale: 1, duration: 0.85, ease: "expo.out", immediateRender: false }, 0.43);
        tl.fromTo(counter, { color: START_COLOR }, { color: END_COLOR, duration: 0.85, ease: "power2.out", immediateRender: false }, 0.43);

        if (BURN) {
          // Two short deterministic brightness flashes in the first 0.25s (a coal catching).
          tl.fromTo(counter, { filter: "brightness(1)" }, { filter: "brightness(2)", duration: 0.03, ease: "power1.out", immediateRender: false }, 0.43);
          seg(counter, { filter: "brightness(2)" }, { filter: "brightness(1.05)" }, 0.46, 0.08, "power2.out");
          seg(counter, { filter: "brightness(1.05)" }, { filter: "brightness(1.8)" }, 0.55, 0.03, "power1.out");
          seg(counter, { filter: "brightness(1.8)" }, { filter: "brightness(1)" }, 0.58, 0.1, "power2.out");

          // The spark flares with the flashes and goes out inside the number.
          seg(halo, { opacity: 0.25, scale: 1 }, { opacity: 0.34, scale: 1.8 }, 0.43, 0.03, "power1.out");
          seg(halo, { opacity: 0.34, scale: 1.8 }, { opacity: 0.12, scale: 2 }, 0.46, 0.08, "power2.out");
          seg(halo, { opacity: 0.12, scale: 2 }, { opacity: 0.3, scale: 2.3 }, 0.55, 0.03, "power1.out");
          seg(halo, { opacity: 0.3, scale: 2.3 }, { opacity: 0, scale: 2.6 }, 0.58, 0.22, "power2.out");
          seg(spark, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.5 }, 0.43, 0.28, "power2.in");

          // ambient-glow-bloom (hero bloom): 0 → 0.40 behind the digits, landing with the count (1.28s).
          tl.fromTo(glow, { opacity: 0, scale: 0.85 }, { opacity: GLOW_PEAK, scale: 1, duration: 0.85, ease: "power2.out" }, 0.43);
        }

        // ── Scene 3 (1.04–1.60): the unit — tracking converges 0.6em → 0.28em. The static layout holds the
        //    final 0.28em; each glyph starts spread by the extra 0.32em per step and travels on x.
        var chars = unit.querySelectorAll(".__p__-ch");
        var SPREAD = 0.32 * unitPx;
        for (var ci = 0; ci < chars.length; ci++) {
          var off = (ci - (chars.length - 1) / 2) * SPREAD;
          tl.fromTo(chars[ci], { x: off, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 1.04);
        }

        // ── Scene 4 (1.60–2.70): hold. Bounded breathe of the glow, ±6% of peak (one finite curve).
        if (BURN) {
          seg(glow, { opacity: GLOW_PEAK }, { opacity: 0.424 }, 1.6, 0.275, "sine.inOut");
          seg(glow, { opacity: 0.424 }, { opacity: 0.376 }, 1.875, 0.55, "sine.inOut");
          seg(glow, { opacity: 0.376 }, { opacity: GLOW_PEAK }, 2.425, 0.275, "sine.inOut");
          tl.fromTo(glowCore, { scale: 1 }, { scale: 1.015, duration: 0.275, ease: "sine.inOut" }, 1.6);
          seg(glowCore, { scale: 1.015 }, { scale: 0.985 }, 1.875, 0.55, "sine.inOut");
          seg(glowCore, { scale: 0.985 }, { scale: 1 }, 2.425, 0.275, "sine.inOut");
        }

        // ── Scene 5 (2.71–3.721): the heat dies; the grey number and unit hold.
        if (COOL) {
          seg(counter, { color: HERO }, { color: ASH_COOL }, 2.71, 1, "power2.inOut");
          seg(unit, { color: BONE }, { color: SMOKE }, 2.71, 1, "power2.inOut");
          seg(glow, { opacity: GLOW_PEAK, scale: 1 }, { opacity: 0, scale: 0.7 }, 2.71, 1, "power2.inOut");
        }

        W.apply(tl);
  window.__timelines["__cid__"] = tl;
      })();
    </script>
  </div>
</template>
