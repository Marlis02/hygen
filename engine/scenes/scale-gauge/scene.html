    { L: 286, R: 446, e: 1326, r: 1262, o: 6 },

    svgEl("polygon", { points: lx + "," + e + " " + M + "," + r + " " + (M + 1) + "," + (r + 1) + " " + (M + 1) + "," + e, fill: INK }, left);

  var NW = 24;                             // faint smoulder wisps before the eruption
  var wP = new Float32Array(NW), wO = new Float32Array(NW), wH = new Float32Array(NW), wX = new Float32Array(NW), wR = new Float32Array(NW);

  var pSt = new Float32Array(NP), pL = new Float32Array(NP), pX0 = new Float32Array(NP), pR = new Float32Array(NP), pPh = new Float32Array(NP);

    pX0[q] = -40 + 1640 * prand(q * 7.9 + 1.7);

  function drawGlow(t) {

      var ap = t - pSt[q];
      if (ap < 0) continue;
      var cyc = ap / pL[q], n = Math.floor(cyc), ph = cyc - n;
      var y = -40 + ph * 2000;
      var x0 = pX0[q] + ((n * 397) % 1640);
      if (x0 > 1600) x0 -= 1640;
      var x = x0 - 0.26 * (y + 40) + 5 * Math.sin(ph * 9.4 + pPh[q]);
      if (x < -30 || x > 1110) continue;
      pxA[q] = x; pyA[q] = y; pOn[q] = 1; any = true;
    }
    if (!any) return;
    ctx.strokeStyle = ASH_LIGHT; ctx.fillStyle = ASH_LIGHT; ctx.lineCap = "round";
    for (var pass = 0; pass < 2; pass++) {
      var big = pass === 1;
      ctx.globalAlpha = 0.22;
      ctx.lineWidth = big ? 3.4 : 2.2;
      ctx.beginPath();
      for (q = 0; q < NP; q++) {
        if (!pOn[q] || (pR[q] > 2.6) !== big) continue;
        ctx.moveTo(pxA[q], pyA[q]);
        ctx.lineTo(pxA[q] + 1.17 * pR[q], pyA[q] - 4.5 * pR[q]);
      }
      ctx.stroke();
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      for (q = 0; q < NP; q++) {
        if (!pOn[q] || (pR[q] > 2.6) !== big) continue;
        ctx.moveTo(pxA[q] + pR[q], pyA[q]);
        ctx.arc(pxA[q], pyA[q], pR[q], 0, TAU);
      }
      ctx.fill();
    }
  }
  // ---- ocean scenery (direction down): water, surface, seabed, marine snow, a sinking ship, bubbles ----
  var NSNOW = 240;
  var snX = new Float32Array(NSNOW), snY = new Float32Array(NSNOW), snV = new Float32Array(NSNOW), snR = new Float32Array(NSNOW), snP = new Float32Array(NSNOW);
  for (var sn = 0; sn < NSNOW; sn++) {
    snX[sn] = prand(sn * 3.1 + 0.7) * 1080;
    snY[sn] = prand(sn * 4.7 + 1.9);
    snV[sn] = 12 + 30 * prand(sn * 5.3 + 2.3);
    snR[sn] = 1 + 1.6 * prand(sn * 6.1 + 3.7);
    snP[sn] = prand(sn * 7.9 + 4.1) * TAU;
  }
  var BED = [];
  for (var bx = 0; bx <= 1120; bx += 40) BED.push(Y1 + 40 + 22 * prand(bx * 0.37 + 9.1) - 10 * Math.sin(bx / 170));
  var SHIP_X = 600;
  function shipY(t) { return Y0 + 4 + (Y1 + 10 - Y0 - 4) * riseE(t - T_ERUPT); }
  function shipTilt(t) {
    var e = riseE(t - T_ERUPT);
    return 1.5 * Math.sin(t * 1.6) * (1 - e) + 16 * Math.sin(Math.PI * Math.min(1, e * 1.15)) + 5 * e;
  }
  function drawOcean(t) {
    var g = ctx.createLinearGradient(0, Y0, 0, 1920);
    g.addColorStop(0, S.colors.heroDeep);
    g.addColorStop(0.62, S.colors.night);
    g.addColorStop(1, S.colors.night);
    ctx.globalAlpha = 1;
    ctx.fillStyle = g;
    ctx.fillRect(0, Y0, 1080, 1920 - Y0);
    ctx.fillStyle = S.colors.heroLight;                // light shafts under the surface, slowly swaying
    for (var k = 0; k < 4; k++) {
      var sx = 170 + k * 250 + 26 * Math.sin(t * 0.4 + k * 1.7);
      ctx.globalAlpha = 0.045;
      ctx.beginPath();
      ctx.moveTo(sx - 34, Y0); ctx.lineTo(sx + 34, Y0); ctx.lineTo(sx - 90, Y0 + 720); ctx.lineTo(sx - 230, Y0 + 720);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 0.55;                            // the surface line
    ctx.strokeStyle = S.colors.text;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var x = 0; x <= 1080; x += 20) {
      var yy = Y0 + 3 * Math.sin(x / 60 + t * 1.8);
      if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();
    ctx.fillStyle = S.colors.ashLight;                 // marine snow
    var span = 1920 - Y0;
    for (var n = 0; n < NSNOW; n++) {
      ctx.globalAlpha = 0.26;
      ctx.beginPath();
      ctx.arc(snX[n] + 8 * Math.sin(t * 0.7 + snP[n]), Y0 + ((snY[n] * span + snV[n] * t) % span), snR[n], 0, TAU);
      ctx.fill();
    }
    ctx.strokeStyle = S.colors.heroLight;              // bubbles trailing the ship
    ctx.lineWidth = 1.5;
    for (var q = 0; q < 60; q++) {
      var te = T_ERUPT + q * 0.045 + 0.03 * prand(q * 2.3 + 1.1);
      var age = t - te;
      if (age <= 0 || age > 1.6) continue;
      var bby = shipY(te) - 20 - age * (90 + 60 * prand(q * 4.4 + 0.3));
      if (bby < Y0 + 6) continue;
      ctx.globalAlpha = 0.45 * (1 - age / 1.6);
      ctx.beginPath();
      ctx.arc(SHIP_X + (prand(q * 3.9 + 2.2) - 0.5) * 300 + 6 * Math.sin(age * 5 + q), bby, 2 + 3 * prand(q * 5.1 + 0.9), 0, TAU);
      ctx.stroke();
    }
    ctx.save();                                        // the ship: cut-paper silhouette with a thin rim light
    ctx.translate(SHIP_X, shipY(t));
    ctx.rotate((shipTilt(t) * Math.PI) / 180);
    ctx.beginPath();
    ctx.moveTo(-200, -8); ctx.lineTo(206, -8); ctx.lineTo(188, 30); ctx.lineTo(-186, 30); ctx.closePath();
    ctx.rect(-150, -30, 290, 22);
    for (var f = 0; f < 4; f++) {
      var fx = -112 + f * 62;
      ctx.moveTo(fx, -30); ctx.lineTo(fx + 16, -30); ctx.lineTo(fx + 9, -80); ctx.lineTo(fx - 7, -80); ctx.closePath();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = S.colors.plane;
    ctx.fill();
    ctx.globalAlpha = 0.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-172, -8); ctx.lineTo(-178, -122); ctx.moveTo(170, -8); ctx.lineTo(164, -122);
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;                               // seabed in front of the landed hull
    ctx.fillStyle = S.colors.plane;
    ctx.beginPath();
    ctx.moveTo(-10, 1930);
    for (var b = 0; b < BED.length; b++) ctx.lineTo(b * 40, BED[b]);
    ctx.lineTo(1130, 1930);
    ctx.closePath();
    ctx.fill();
  }

  // ---- D4 sceneries against the same gauge (direction up): a tsunami wave rises to the value, a mountain with its
  //      summit at the top of the scale, a tower whose windows light up below the rising marker ----
  function drawScenery(t) {
    var e = riseE(t - T_ERUPT), top = CY - HTOP, x, k;
    ctx.globalAlpha = 1;
    if (SCENERY === "wave") {
      var h = HTOP * e, cx0 = 430, wid = 380;
      var sea = ctx.createLinearGradient(0, top, 0, 1920);
      sea.addColorStop(0, S.colors.heroDeep);
      sea.addColorStop(0.55, S.colors.plane);
      sea.addColorStop(1, S.colors.night);
      ctx.fillStyle = sea;
      ctx.beginPath();
      ctx.moveTo(-20, 1940);
      for (x = -20; x <= 1100; x += 10) {
        var d = (x - cx0) / wid;
        var hump = h * Math.exp(-d * d * (d > 0 ? 2.6 : 1.1));      // steep front on the right, a long back on the left
        ctx.lineTo(x, CY - hump + 6 * Math.sin(x / 38 + t * 2.2));
      }
      ctx.lineTo(1100, 1940);
      ctx.closePath();
      ctx.fill();
      if (h > 40) {                                                 // the lip and the foam of the crest
        var crx = cx0 + wid * 0.18, cry = CY - h * 0.97;
        ctx.strokeStyle = S.colors.heroLight;
        ctx.lineWidth = 5;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.moveTo(cx0 - wid * 0.35, CY - h * 0.9);
        ctx.quadraticCurveTo(cx0, CY - h * 1.04, crx + 60, cry + 40);
        ctx.quadraticCurveTo(crx + 90, cry + 80, crx + 40, cry + 90);
        ctx.stroke();
        ctx.fillStyle = S.colors.text;
        for (k = 0; k < 40; k++) {
          ctx.globalAlpha = 0.35 * prand(k * 3.1 + 1);
          ctx.beginPath();
          ctx.arc(crx + 60 + 70 * (prand(k * 2.7) - 0.5), cry + 40 + 60 * prand(k * 4.3) + 8 * Math.sin(t * 3 + k), 2 + 4 * prand(k * 5.9), 0, TAU);
          ctx.fill();
        }
      }
    } else if (SCENERY === "mountain") {
      var ridge = [[-60, CY + 70], [150, CY - 230], [290, CY - 150], [470, top + 8], [560, top + 44], [700, CY - 310], [860, CY - 190], [1140, CY + 50]];
      ctx.fillStyle = S.colors.plane;
      ctx.beginPath();
      ctx.moveTo(-60, 1940);
      for (k = 0; k < ridge.length; k++) ctx.lineTo(ridge[k][0], ridge[k][1]);
      ctx.lineTo(1140, 1940);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = S.colors.ashLight;                            // snow on the summit
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.moveTo(470, top + 8); ctx.lineTo(412, top + 118); ctx.lineTo(452, top + 98); ctx.lineTo(482, top + 136); ctx.lineTo(522, top + 102); ctx.lineTo(560, top + 44);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = S.colors.ashMid;                            // slow cloud bands drifting across the slope
      ctx.lineWidth = 26;
      ctx.lineCap = "round";
      for (k = 0; k < 3; k++) {
        ctx.globalAlpha = 0.18;
        var by = CY - 180 - k * 210, bx = 200 + ((t * (14 + 6 * k) + k * 260) % 700);
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + 260, by - 8); ctx.stroke();
      }
    } else if (SCENERY === "building") {
      ctx.fillStyle = S.colors.plane;
      ctx.fillRect(0, CY, 1080, 1920 - CY);
      var blocks = [[30, CY - 190, 130], [175, CY - 270, 150], [700, CY - 230, 150], [865, CY - 150, 130]];
      for (k = 0; k < blocks.length; k++) ctx.fillRect(blocks[k][0], blocks[k][1], blocks[k][2], CY - blocks[k][1]);
      var tiers = [[360, 620, CY - HTOP * 0.72], [395, 585, CY - HTOP * 0.9], [440, 540, top + 36]];
      for (k = 0; k < tiers.length; k++) ctx.fillRect(tiers[k][0], tiers[k][2], tiers[k][1] - tiers[k][0], CY - tiers[k][2]);
      ctx.fillRect(487, top, 6, 40);                                // spire at the top of the scale
      var line = CY - HTOP * e;                                     // windows below the marker are lit
      ctx.fillStyle = S.colors.heroLight;
      for (var r = 0; r * 26 < HTOP - 40; r++) {
        var wy = CY - 20 - r * 26;
        if (wy < line) break;
        var tier = wy > tiers[0][2] ? tiers[0] : wy > tiers[1][2] ? tiers[1] : tiers[2];
        for (var c = tier[0] + 14; c < tier[1] - 14; c += 22) {
          if (prand(r * 13.7 + c * 0.31) < 0.45) continue;
          ctx.globalAlpha = 0.35 + 0.4 * prand(r * 3.3 + c * 0.77);
          ctx.fillRect(c, wy, 9, 12);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // altitude marker + readout: same function as the drawn column top, so they cannot drift apart
  var lastAlt = -1;
  function hud(t) {
    var e = riseE(t - T_ERUPT);
    if (DOWN) {                                  // depth: marker sinks from the surface to the value line, readout rides above it
      var yd = Y0 + (Y1 - Y0) * e;
      marker.style.transform = "translateY(" + (yd - 1010).toFixed(2) + "px)";
      readout.style.transform = "translateY(" + (yd - 150 - 1020).toFixed(2) + "px) scale(" + (0.62 + 0.38 * e).toFixed(4) + ")";
    } else {
      var hpx = HTOP * e;
      marker.style.transform = "translateY(" + (-hpx).toFixed(2) + "px)";
      readout.style.transform = "translateY(" + (-hpx).toFixed(2) + "px) scale(" + (0.62 + 0.38 * e).toFixed(4) + ")";
    }
    var v = Math.round(P.value * e);
    if (v !== lastAlt) { altEl.textContent = fmtNum(v); lastAlt = v; }
  }
  function render(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(canvas.width / 1080, 0, 0, canvas.height / 1920, 0, 0);
    if (VOLCANO) {
      drawGlow(t);
      drawWisps(t);
      drawColumn(t);
      drawSparks(t);
      drawDust(t);
      drawPumice(t);
    } else if (OCEAN) {
      drawOcean(t);
    } else if (SCENERY) {
      drawScenery(t);
    }
    ctx.globalAlpha = 1;
    hud(t);
  }

  // ---- multi-phase camera: phase scale + sine drift + impact rumble, one writer, pure function of t ----
  var eOut = gsap.parseEase("power2.out"), eInOut = gsap.parseEase("power2.inOut");
  function camScale(t) {
    if (t < 1.8) return 1.015 - 0.015 * eOut(t / 1.8);           // settle after the cut
    if (t < 5.08) return 1;                                       // neutral while the column climbs the scale
    if (t < 7.68) return 1 + 0.012 * eInOut((t - 5.08) / 2.6);   // slow push as the pumice falls
    if (t < 8.24) return 1.012;
    return 1.012 + 0.013 * eOut(clamp01((t - 8.24) / 1.3));      // push on the collapse
  }
  function writeCamera(t) {
    var s = camScale(t);
    var p = TAU * 1.5 * (t / DUR);
    var dx = 4 * Math.sin(p), dy = 2 * Math.sin(p * 1.3);
    for (var j = 0; j < 7 && P.scenery === "volcano"; j++) {
      var d = t - (8.59 + 0.07 * j);
      if (d <= 0) continue;
      var env = 1.4 * Math.exp(-d / 0.16);
      dx += env * Math.sin(d * 57 + j * 1.7);
      dy += env * 0.8 * Math.sin(d * 44 + j * 2.3 + 1);
    }
    var ty = 810 * (1 - 1 / s);                                   // pins y 150: the date and the 30 KM readout never rise
    camera.style.transform = "scale(" + s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px, " + (ty + dy).toFixed(2) + "px)";
  }

  // ---- timeline ----
  var tl = gsap.timeline({ paused: true });
  /*{{hygen:warp}}*/
  var clock = { t: 0 };
  tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(W.ref(clock.t)); } }, 0);
  var drift = { t: 0 };
  tl.fromTo(drift, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { writeCamera(W.ref(drift.t)); } }, 0);

  // Scene 1: 79 counts up on "Семьдесят девятый", Н. Э. on "эры"
  // property tween (not onUpdate): a seek that lands past its end still writes 79
  tl.fromTo(yearEl, { textContent: 0 }, { textContent: P.dateValue, snap: { textContent: 1 }, duration: 1, ease: "power2.out" }, 0.2);
  tl.fromTo(yearEl, { scale: 0.55 }, { scale: 1, duration: 1, ease: "power2.out" }, 0.2);
  tl.fromTo(eraEl, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 1.54);

  // Scene 2: axis draws on "Везувий", marker + readout ride the column top, sky darkens
  tl.fromTo(axis, { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out" }, T_ERUPT);
  tl.fromTo(ticks, { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power2.out", stagger: 0.055 }, T_ERUPT + 0.02);
  tl.fromTo([marker, readout], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, T_ERUPT);
  if (OCEAN) tl.set(sky, { opacity: 1 }, 0);
  else tl.fromTo(sky, { opacity: 0 }, { opacity: 0.5, duration: 2.2, ease: "power1.inOut" }, T_ERUPT);

  // Scene 4: ПЕМЗА wipes in on "пемза"; pumice layers grow on every roof from "по нескольку"
  if (P.word) tl.fromTo(wordEl, { clipPath: "inset(-30% 100% -30% -4%)" }, { clipPath: "inset(-30% -8% -30% -4%)", duration: 0.5, ease: "power2.inOut" }, 5.89);
  var layer = { p: 0 };
  if (VOLCANO) tl.fromTo(layer, { p: 0 }, { p: 1, duration: 1.75, ease: "power1.inOut", onUpdate: function () {
    var sy = "scale(1 " + layer.p.toFixed(4) + ")";
    for (var k = 0; k < strips.length; k++) strips[k].setAttribute("transform", sy);
  } }, 6.45);

  // Scene 5: roofs give way left to right (0.07 s step): halves drop 26 px, rotate ±10°, then hold
  if (P.scenery === "volcano") roofs.forEach(function (rf) {
    var st = { p: 0 };
    tl.fromTo(st, { p: 0 }, { p: 1, duration: 0.35, ease: "power2.in", onUpdate: function () {
      var dy = (26 * st.p).toFixed(2), ang = 10 * st.p;
      rf.left.setAttribute("transform", "translate(0 " + dy + ") rotate(" + ang.toFixed(3) + " " + rf.lx + " " + rf.e + ")");
      rf.right.setAttribute("transform", "translate(0 " + dy + ") rotate(" + (-ang).toFixed(3) + " " + rf.rx + " " + rf.e + ")");
    } }, rf.at);
  });

  render(0);
  writeCamera(0);
  window.__timelines = window.__timelines || {};
  W.apply(tl);
  window.__timelines["__cid__"] = tl;
})();
</script>
</template>
