<!-- hygen scene picture-zoom (from the painting insert of examples/pompeii-short). Times in the script are REFERENCE times; the build warps them onto the current voice. Contract: engine/scenes/CONTRACT.md -->
<template id="__p__-template">
<script src="assets/vendor/gsap.min.js"></script>
<style>
{{hygen:fontfaces}}
</style>
<style>
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #__p__-ground { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background-color: {{hygen:color.night}}; }
  #__p__-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
  #__p__-camera { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #__p__-back { position: absolute; left: -80px; top: -80px; width: 1240px; height: 2080px; object-fit: cover; display: none; filter: blur(34px) brightness(0.45); }
  #__p__-img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; display: block; }
  #__p__-tint { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background-color: {{hygen:color.heroDeep}}; opacity: 0; }
  #__p__-shade { position: absolute; left: 0; top: 1060px; width: 1080px; height: 860px; background: linear-gradient(rgba({{hygen:rgb.night}}, 0) 0%, rgba({{hygen:rgb.night}}, 0.72) 60%, rgba({{hygen:rgb.night}}, 0.8) 100%); display: none; }
  #__p__-fx { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #__p__-credit { position: absolute; right: 90px; top: 120px; text-align: right; font-family: {{hygen:font.body}}; font-weight: 600; font-size: {{hygen:size.labelSm}}px; line-height: 1.3; letter-spacing: 0.14em; text-transform: uppercase; color: rgba({{hygen:rgb.text}}, 0.85); white-space: nowrap; }
  #__p__-credit-sub { display: block; font-weight: 500; font-size: 22px; letter-spacing: 0.06em; text-transform: none; color: rgba({{hygen:rgb.text}}, 0.92); }
  #__p__-title { position: absolute; left: 90px; top: 1240px; font-family: {{hygen:font.display}}; font-weight: 600; font-size: {{hygen:size.title}}px; line-height: 1.05; letter-spacing: 0.1em; text-transform: uppercase; color: {{hygen:color.text}}; white-space: nowrap; }
</style>
<div id="root" data-composition-id="__cid__" data-start="0" data-duration="{{hygen:duration}}" data-width="1080" data-height="1920">
  <div id="__p__-ground" class="clip" data-start="0" data-duration="{{hygen:duration}}" data-track-index="0"></div>
  <div id="__p__-stage" class="clip" data-start="0" data-duration="{{hygen:duration}}" data-track-index="1">
    <div id="__p__-camera" data-layout-allow-overflow="">
      <img id="__p__-back" src="" alt="" />
      <img id="__p__-img" src="" alt="" />
      <div id="__p__-tint"></div>
    </div>
    <div id="__p__-shade"></div>
    <canvas id="__p__-fx" width="540" height="960"></canvas>
    <div id="__p__-credit"><span id="__p__-credit-main">{{hygen:param.credit}}</span><span id="__p__-credit-sub">{{hygen:param.creditSub}}</span></div>
    <div id="__p__-title">{{hygen:param.title}}</div>
  </div>
</div>
<script>
(function () {
  /*{{hygen:params}}*/
  var D = 5.0;
  var tl = gsap.timeline({ paused: true });
  /*{{hygen:warp}}*/
  var byId = function (id) { return document.getElementById(id); };
  var camera = byId("__p__-camera");
  var img = byId("__p__-img");
  var back = byId("__p__-back");
  var ctx = byId("__p__-fx").getContext("2d");
  var W2 = 540, H2 = 960;

  // ---- image, fit, crop, focus ----
  img.setAttribute("src", P.image);
  img.setAttribute("alt", P.title || P.credit || "");
  if (P.fit === "band") {
    back.setAttribute("src", P.image);
    back.style.display = "block";
    img.style.top = "520px";                    // a full-width band centred on the hero line
    img.style.height = "800px";
    img.style.objectFit = "contain";
  } else {
    img.style.objectPosition = (P.crop * 100).toFixed(1) + "% 50%";
  }
  camera.style.transformOrigin = P.focus.x + "px " + P.focus.y + "px";
  byId("__p__-tint").style.opacity = String(P.tint);
  if (P.title) byId("__p__-shade").style.display = "block";
  else byId("__p__-title").style.display = "none";
  if (!P.credit) byId("__p__-credit").style.display = "none";

  // ---- particles over the image: seeded, every position a pure function of time ----
  function rand(n) { var x = Math.sin((n + SEED * 101.3) * 91.7 + 47.3) * 43758.5453; return x - Math.floor(x); }
  var EMBER_SHARE = P.particles === "embers" ? 0.7 : P.particles === "ash" ? 0.12 : 0;
  var COUNT = P.particles === "none" ? 0 : P.particles === "snow" ? 200 : 260;
  var FLAKES = [];
  for (var i = 0; i < COUNT; i++) {
    var ember = rand(i + 0.5) < EMBER_SHARE;
    var snow = P.particles === "snow";
    FLAKES.push({
      x: rand(i + 1.1) * W2, y: rand(i + 2.3) * H2,
      r: ember ? 0.7 + rand(i + 3.7) * 0.9 : (snow ? 0.9 + rand(i + 4.1) * 1.8 : 0.6 + rand(i + 4.1) * 1.6),
      vy: (ember ? 38 : snow ? 22 : 55) + rand(i + 5.9) * (snow ? 30 : 70),
      vx: snow ? -6 - rand(i + 6.2) * 10 : -14 - rand(i + 6.2) * 18,
      sw: 3 + rand(i + 7.4) * 7, sp: 0.8 + rand(i + 8.8) * 1.6, ph: rand(i + 9.6) * 6.283,
      a: ember ? 0.9 : snow ? 0.45 + rand(i + 10.3) * 0.4 : 0.35 + rand(i + 10.3) * 0.45, ember: ember
    });
  }
  function draw(t) {
    ctx.clearRect(0, 0, W2, H2);
    for (var i = 0; i < FLAKES.length; i++) {
      var f = FLAKES[i];
      var y = ((f.y + f.vy * t) % (H2 + 20)) - 10;
      var x = ((((f.x + f.vx * t + Math.sin(f.ph + f.sp * t) * f.sw) % (W2 + 20)) + W2 + 20) % (W2 + 20)) - 10;
      if (f.ember) {
        var flick = 0.65 + 0.35 * Math.sin(f.ph * 3 + t * 9);
        ctx.globalAlpha = f.a * flick * 0.35;
        ctx.fillStyle = S.colors.hero;
        ctx.beginPath(); ctx.arc(x, y, f.r * 3.2, 0, 6.283); ctx.fill();
        ctx.globalAlpha = f.a * flick;
        ctx.fillStyle = S.colors.heroLight;
        ctx.beginPath(); ctx.arc(x, y, f.r, 0, 6.283); ctx.fill();
      } else {
        ctx.globalAlpha = f.a;
        ctx.fillStyle = P.particles === "snow" ? S.colors.text : (i % 3 ? S.colors.ashLight : S.colors.muted);
        ctx.beginPath(); ctx.arc(x, y, f.r, 0, 6.283); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // one full-span driver: the canvas never freezes on a seek
  var clock = { t: 0 };
  draw(0);
  tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: function () { draw(W.ref(clock.t)); } }, 0);
  tl.fromTo(camera, { scale: P.zoomFrom, x: 10, y: 0 }, { scale: P.zoomTo, x: -16, y: 14, duration: D, ease: "none" }, 0);
  if (P.credit) tl.fromTo(byId("__p__-credit"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.35);
  if (P.title) {
    tl.fromTo(byId("__p__-title"), { clipPath: "inset(-30% 100% -30% -4%)" }, { clipPath: "inset(-30% -8% -30% -4%)", duration: 0.6, ease: "power2.inOut" }, 1.2);
    tl.fromTo(byId("__p__-shade"), { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, 0.9);
  }

  window.__timelines = window.__timelines || {};
  W.apply(tl);
  window.__timelines["__cid__"] = tl;
})();
</script>
</template>
