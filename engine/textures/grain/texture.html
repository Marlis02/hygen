<!-- hygen texture grain (from the global overlay of engine/src/assemble.ts, D2): two seeded 512 px tiles from
     engine/py/make_grain.py, stepped by timeline time. Contract: engine/scenes/CONTRACT.md, «Текстуры». -->
<template id="__p__-template">
<div id="root" data-composition-id="__cid__" data-start="0" data-duration="{{hygen:duration}}" data-width="1080" data-height="1920">
  <style>
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    #__p__-overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #__p__-texture { position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; }
    #__p__-dark, #__p__-light { position: absolute; inset: 0; background-size: 512px 512px; }
    #__p__-dark { background-image: url("assets/grain/grain-dark.png"); }
    #__p__-light { background-image: url("assets/grain/grain-light.png"); }
  </style>
  <div id="__p__-overlay" class="clip" data-start="0" data-duration="{{hygen:duration}}" data-track-index="0">
    <div id="__p__-texture"><div id="__p__-dark"></div><div id="__p__-light"></div></div>
  </div>
</div>
<script src="assets/vendor/gsap.min.js"></script>
<script>
(function () {
  /*{{hygen:params}}*/
  var tex = document.getElementById("__p__-texture");
  document.getElementById("__p__-dark").style.opacity = String(P.dark);
  document.getElementById("__p__-light").style.opacity = String(P.light);
  var OFFS = [[0, 0], [-5, -5], [-10, 5], [5, -10], [-5, 15], [-10, 5], [15, 0], [0, 10], [-15, 0], [10, 5], [3, -7], [-12, -3], [8, 12]];
  var tl = gsap.timeline({ paused: true });
  var clock = { t: 0 };
  tl.fromTo(clock, { t: 0 }, {
    t: DUR, duration: DUR, ease: "none",
    onUpdate: function () {
      var o = OFFS[Math.floor(clock.t * P.fps) % OFFS.length];
      tex.style.transform = "translate(" + o[0] + "%, " + o[1] + "%)";
    }
  }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["__cid__"] = tl;
})();
</script>
</template>
