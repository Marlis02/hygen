<!-- hygen texture ash (from the particles of picture-zoom and the pumice of scale-gauge, Pompeii): seeded flakes,
     every position a pure function of time. Contract: engine/scenes/CONTRACT.md, «Текстуры». -->
<template id="__p__-template">
<div id="root" data-composition-id="__cid__" data-start="0" data-duration="{{hygen:duration}}" data-width="1080" data-height="1920">
  <style>
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    #__p__-c { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <canvas id="__p__-c" class="clip" width="540" height="960" data-start="0" data-duration="{{hygen:duration}}" data-track-index="0"></canvas>
</div>
<script src="assets/vendor/gsap.min.js"></script>
<script>
(function () {
  /*{{hygen:params}}*/
  var ctx = document.getElementById("__p__-c").getContext("2d");
  var W = 1080, H = 1920, TAU = Math.PI * 2, PAD = 40;
  function rand(n) { var x = Math.sin((n + SEED * 101.3) * 91.7 + 47.3) * 43758.5453; return x - Math.floor(x); }
  var PUMICE = P.style === "pumice";
  var ANG = (P.angle * Math.PI) / 180, SIN = Math.sin(ANG), COS = Math.cos(ANG);
  var N = Math.round(520 * P.density);
  var F = [];
  for (var i = 0; i < N; i++) {
    var ember = rand(i * 1.31 + 0.5) < P.embers;
    F.push({
      x: rand(i * 2.17 + 1.1) * (W + 2 * PAD), y: rand(i * 3.31 + 2.3) * (H + 2 * PAD),
      r: (ember ? 0.7 + rand(i * 3.7 + 0.2) * 0.9 : PUMICE ? 1.5 + 2.5 * Math.pow(rand(i * 8.3 + 4.9), 1.5) : 1.2 + 3.2 * rand(i * 4.1 + 0.7)) * P.size * 2,
      v: (ember ? 38 + 50 * rand(i * 5.9 + 1.7) : 55 + 120 * rand(i * 5.9 + 1.7)) * P.speed,
      sw: PUMICE ? 5 : 6 + 14 * rand(i * 7.4 + 3.1), sp: 0.8 + 1.6 * rand(i * 8.8 + 2.2), ph: rand(i * 9.6 + 0.4) * TAU,
      a: ember ? 0.9 : 0.35 + 0.45 * rand(i * 10.3 + 5.5), c2: i % 3 === 2, ember: ember
    });
  }
  function wrap(v, span) { return (((v % span) + span) % span) - PAD; }
  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, 540, 960);
    ctx.setTransform(0.5, 0, 0, 0.5, 0, 0);
    for (var i = 0; i < F.length; i++) {
      var f = F[i], d = f.v * t;
      var y = wrap(f.y + d * COS, H + 2 * PAD);
      var x = wrap(f.x - d * SIN + Math.sin(f.ph + f.sp * t) * f.sw, W + 2 * PAD);
      if (f.ember) {
        var fl = 0.65 + 0.35 * Math.sin(f.ph * 3 + t * 9);
        ctx.globalAlpha = f.a * fl * 0.35;
        ctx.fillStyle = P.emberColor;
        ctx.beginPath(); ctx.arc(x, y, f.r * 3.2, 0, TAU); ctx.fill();
        ctx.globalAlpha = f.a * fl;
        ctx.fillStyle = P.emberCore;
        ctx.beginPath(); ctx.arc(x, y, f.r, 0, TAU); ctx.fill();
      } else if (PUMICE) {
        ctx.globalAlpha = 0.22;
        ctx.strokeStyle = P.color;
        ctx.lineWidth = f.r * 0.9;
        ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + SIN * 4.5 * f.r, y - COS * 4.5 * f.r); ctx.stroke();
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = P.color;
        ctx.beginPath(); ctx.arc(x, y, f.r, 0, TAU); ctx.fill();
      } else {
        ctx.globalAlpha = f.a;
        ctx.fillStyle = f.c2 ? P.color2 : P.color;
        ctx.beginPath(); ctx.arc(x, y, f.r, 0, TAU); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
  var tl = gsap.timeline({ paused: true });
  var clock = { t: 0 };
  draw(0);
  tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["__cid__"] = tl;
})();
</script>
</template>
