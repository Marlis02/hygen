<!-- hygen texture rain (D3.5): seeded slanted streaks in three depth planes, gusts from a smooth seeded noise
     (the gust drift is its exact integral), every position a pure function of time. Contract: engine/scenes/CONTRACT.md, «Текстуры». -->
<template id="__p__-template">
<div id="root" data-composition-id="__cid__" data-start="0" data-duration="{{hygen:duration}}" data-width="1080" data-height="1920">
  <style>
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    #__p__-c { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <canvas id="__p__-c" class="clip" width="540" height="960" data-start="0" data-duration="{{hygen:duration}}" data-track-index="0"></canvas>
</div>
<script src="assets/vendor/gsap.min.js"></script>
<script>
(function () {
  /*{{hygen:params}}*/
  var ctx = document.getElementById("__p__-c").getContext("2d");
  var W = 1080, H = 1920, TAU = Math.PI * 2;
  function rand(n) { var x = Math.sin((n + SEED * 101.3) * 91.7 + 47.3) * 43758.5453; return x - Math.floor(x); }
  var ANG = (P.angle * Math.PI) / 180, SIN = Math.sin(ANG), COS = Math.cos(ANG);
  var LK = P.length * (0.55 + 0.45 * P.speed);          // streaks read as motion blur: faster → longer
  // depth planes far → near: longer, thicker, brighter, faster
  var PLANES = [
    { share: 0.5, v: 950, len: 38, w: 1.6, a: 0.34 },
    { share: 0.32, v: 1500, len: 70, w: 2.2, a: 0.55 },
    { share: 0.18, v: 2300, len: 120, w: 3.2, a: 0.85 }
  ];
  var PAD = Math.ceil(120 * 1.3 * LK) + 24;              // a streak never pops inside the frame
  var SX = W + 2 * PAD, SY = H + 2 * PAD;
  var N = Math.round(760 * P.density);
  var B = [[], [], [], [], [], []];                      // plane × alpha bucket → one stroke() each
  var n = 0;
  for (var p = 0; p < 3; p++) {
    var cnt = p === 2 ? Math.max(0, N - n) : Math.round(N * PLANES[p].share);
    for (var i = 0; i < cnt; i++, n++) {
      B[p * 2 + (rand(n * 1.37 + 0.21) < 0.5 ? 0 : 1)].push({
        x: rand(n * 2.17 + 1.1) * SX, y: rand(n * 3.31 + 2.3) * SY,
        v: PLANES[p].v * (0.85 + 0.3 * rand(n * 5.9 + 1.7)) * P.speed,
        len: PLANES[p].len * (0.7 + 0.6 * rand(n * 7.4 + 3.1)) * LK
      });
    }
  }
  // gusts: the angle wanders by a sum of three seeded sines; drops drift by its integral (small-angle)
  var GA = (P.gusts * 10 * Math.PI) / 180;
  var GW = [0.47, 1.13, 2.71], GK = [0.6, 0.3, 0.1];
  var GP = [rand(11.3) * TAU, rand(12.7) * TAU, rand(13.9) * TAU];
  function gust(t) { var s = 0; for (var k = 0; k < 3; k++) s += GK[k] * Math.sin(GW[k] * t + GP[k]); return GA * s; }
  function gustSum(t) { var s = 0; for (var k = 0; k < 3; k++) s += (GK[k] / GW[k]) * (Math.cos(GP[k]) - Math.cos(GW[k] * t + GP[k])); return GA * s; }
  function wrap(v, span) { return (((v % span) + span) % span) - PAD; }
  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, 540, 960);
    ctx.setTransform(0.5, 0, 0, 0.5, 0, 0);
    var th = ANG + gust(t), ts = Math.sin(th), tc = Math.cos(th), G = gustSum(t);
    ctx.strokeStyle = P.color;
    ctx.lineCap = "round";
    for (var b = 0; b < 6; b++) {
      var list = B[b], pl = PLANES[b >> 1];
      if (!list.length) continue;
      ctx.globalAlpha = pl.a * (b & 1 ? 1 : 0.6);
      ctx.lineWidth = pl.w * P.thickness;
      ctx.beginPath();
      for (var i = 0; i < list.length; i++) {
        var d = list[i], s = d.v * t;
        var x = wrap(d.x - s * SIN - d.v * COS * G, SX);
        var y = wrap(d.y + s * COS - d.v * SIN * G, SY);
        ctx.moveTo(x, y);
        ctx.lineTo(x + ts * d.len, y - tc * d.len);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  var tl = gsap.timeline({ paused: true });
  var clock = { t: 0 };
  draw(0);
  tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["__cid__"] = tl;
})();
</script>
</template>
