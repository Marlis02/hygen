<!-- hygen texture embers (from the ember particles of picture-zoom and the vent sparks of scale-gauge, Pompeii).
     Contract: engine/scenes/CONTRACT.md, «Текстуры». -->
<template id="__p__-template">
<div id="root" data-composition-id="__cid__" data-start="0" data-duration="{{hygen:duration}}" data-width="1080" data-height="1920">
  <style>
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    #__p__-c { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <canvas id="__p__-c" class="clip" width="540" height="960" data-start="0" data-duration="{{hygen:duration}}" data-track-index="0"></canvas>
</div>
<script src="assets/vendor/gsap.min.js"></script>
<script>
(function () {
  /*{{hygen:params}}*/
  var ctx = document.getElementById("__p__-c").getContext("2d");
  var W = 1080, H = 1920, TAU = Math.PI * 2;
  function rand(n) { var x = Math.sin((n + SEED * 101.3) * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  var ANG = (P.angle * Math.PI) / 180, SIN = Math.sin(ANG), COS = Math.cos(ANG);
  var BOTTOM = P.source === "bottom";
  var N = Math.round(240 * P.density);
  var E = [];
  for (var i = 0; i < N; i++) {
    var life = (2.2 + 2.6 * rand(i * 1.7 + 0.3)) / P.speed;
    E.push({
      x: -60 + rand(i * 2.9 + 1.1) * (W + 120), y: BOTTOM ? H + 20 + 80 * rand(i * 3.3 + 2.2) : 200 + rand(i * 3.3 + 2.2) * (H - 200),
      life: life, off: rand(i * 4.1 + 0.7) * life, rise: (BOTTOM ? 900 + 800 * rand(i * 5.3 + 1.9) : 260 + 420 * rand(i * 5.3 + 1.9)),
      r: (1.4 + 2.2 * Math.pow(rand(i * 6.1 + 3.7), 1.6)) * P.size, sw: 8 + 18 * rand(i * 7.7 + 4.1), sp: 1.2 + 2.2 * rand(i * 8.3 + 0.9),
      ph: rand(i * 9.1 + 2.6) * TAU, fl: 7 + 8 * rand(i * 10.7 + 5.2)
    });
  }
  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, 540, 960);
    ctx.setTransform(0.5, 0, 0, 0.5, 0, 0);
    for (var i = 0; i < E.length; i++) {
      var e = E[i];
      var ph = ((t + e.off) % e.life) / e.life;
      var d = e.rise * ph;
      var x = e.x + d * SIN + Math.sin(e.ph + e.sp * (t + e.off)) * e.sw * ph;
      var y = e.y - d * COS;
      var fade = Math.pow(1 - ph, 0.7) * Math.min(1, ph / 0.06);
      var fl = 1 - 0.45 * P.flicker * (0.5 + 0.5 * Math.sin(t * e.fl + e.ph));
      var a = fade * fl;
      if (a <= 0.01) continue;
      var r = e.r * (1 - 0.35 * ph);
      ctx.globalAlpha = a * 0.3;
      ctx.fillStyle = P.color;
      ctx.beginPath(); ctx.arc(x, y, r * 3.4, 0, TAU); ctx.fill();
      ctx.globalAlpha = a;
      ctx.fillStyle = P.core;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  var tl = gsap.timeline({ paused: true });
  var clock = { t: 0 };
  draw(0);
  tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["__cid__"] = tl;
})();
</script>
</template>
