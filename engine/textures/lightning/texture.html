<!-- hygen texture lightning: double sky flash + a seeded branching bolt on each cue. Contract: engine/scenes/CONTRACT.md, «Текстуры». -->
<template id="__p__-template">
<div id="root" data-composition-id="__cid__" data-start="0" data-duration="{{hygen:duration}}" data-width="1080" data-height="1920">
  <style>
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    #__p__-c { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <canvas id="__p__-c" class="clip" width="540" height="960" data-start="0" data-duration="{{hygen:duration}}" data-track-index="0"></canvas>
</div>
<script src="assets/vendor/gsap.min.js"></script>
<script>
(function () {
  /*{{hygen:params}}*/
  var ctx = document.getElementById("__p__-c").getContext("2d");
  var W = 1080, H = 1920;
  function rand(n) { var x = Math.sin((n + SEED * 101.3) * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  // one bolt per strike: a jagged main channel from the top edge down to reach·H, with 2–4 short branches
  function bolt(k) {
    var x0 = W * Math.min(0.92, Math.max(0.08, P.x + (rand(k * 7.1 + 0.3) - 0.5) * 0.5));
    var y1 = H * P.reach * (0.85 + 0.3 * rand(k * 3.3 + 1.9));
    var pts = [[x0, -30]], n = 22, x = x0;
    for (var i = 1; i <= n; i++) {
      x += (rand(k * 11.3 + i * 1.7) - 0.5) * 90 + (rand(k * 5.9 + 2.2) - 0.5) * 12;
      pts.push([x, -30 + (y1 + 30) * (i / n)]);
    }
    var branches = [], nb = 2 + Math.floor(rand(k * 9.7 + 4.4) * 3);
    for (var b = 0; b < nb; b++) {
      var from = pts[4 + Math.floor(rand(k * 13.1 + b * 3.7) * (n - 8))];
      var dir = rand(k * 17.3 + b * 2.9) < 0.5 ? -1 : 1, bx = from[0], by = from[1], br = [[bx, by]];
      for (var j = 1; j <= 7; j++) {
        bx += dir * (18 + 30 * rand(k * 19.7 + b * 5.1 + j)) ;
        by += 30 + 40 * rand(k * 23.9 + b * 7.3 + j);
        br.push([bx, by]);
      }
      branches.push(br);
    }
    return { pts: pts, branches: branches };
  }
  var STRIKES = (P.strikes || []).map(function (at, k) { return { at: at, shape: bolt(k) }; });
  function path(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  }
  // sky: two pulses (0 and 0.13 s), bolt: visible 0.25 s with a flicker
  function skyAlpha(d) {
    if (d < 0 || d > 0.6) return 0;
    var a = Math.exp(-Math.pow((d - 0.03) / 0.03, 2)) * 1 + Math.exp(-Math.pow((d - 0.15) / 0.05, 2)) * 0.6;
    return a * (d > 0.2 ? Math.max(0, 1 - (d - 0.2) / 0.4) : 1);
  }
  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, 540, 960);
    ctx.setTransform(0.5, 0, 0, 0.5, 0, 0);
    for (var k = 0; k < STRIKES.length; k++) {
      var d = t - STRIKES[k].at;
      if (d < 0 || d > 0.6) continue;
      var sky = skyAlpha(d) * P.flash;
      if (sky > 0.003) {
        var g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, "rgba(" + P.glowRgb + "," + (0.55 * sky).toFixed(3) + ")");
        g.addColorStop(0.6, "rgba(" + P.glowRgb + "," + (0.18 * sky).toFixed(3) + ")");
        g.addColorStop(1, "rgba(" + P.glowRgb + ",0)");
        ctx.globalAlpha = 1;
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }
      if (!P.bolt || d > 0.26) continue;
      var on = d < 0.05 || (d > 0.1 && d < 0.26) ? 1 : 0.35;
      var s = STRIKES[k].shape;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      var widths = [26, 11, 3.2], alphas = [0.12, 0.3, 1], colors = [P.glow, P.glow, P.color];
      for (var w = 0; w < 3; w++) {
        ctx.globalAlpha = alphas[w] * on;
        ctx.strokeStyle = colors[w];
        ctx.lineWidth = widths[w];
        path(s.pts); ctx.stroke();
        ctx.lineWidth = widths[w] * 0.55;
        for (var b = 0; b < s.branches.length; b++) { path(s.branches[b]); ctx.stroke(); }
      }
    }
    ctx.globalAlpha = 1;
  }
  var tl = gsap.timeline({ paused: true });
  var clock = { t: 0 };
  draw(0);
  tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["__cid__"] = tl;
})();
</script>
</template>
