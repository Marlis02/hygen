<!--
  word-by-word — caption skin (hygen preset) (project-local source for faceless-explainer/scripts/captions.mjs).

  captions.mjs fills the reserved holes (groups, duration, canvas size, brand tokens + @font-face),
  wraps the fragment in a template and writes compositions/captions.html.

  Look: word-synced subtitles for a 1080x1920 Short. Large Inter 700 (60px) in bone on a flat charcoal
  plate with a single 2px ember hairline on top (the brand's one accent). The plate is bottom-anchored:
  its lower edge sits at y = 1670, i.e. 250px above the frame edge, clear of the Shorts/TikTok title,
  channel row and action rail. Upcoming words are dim ash, the spoken word lights to bone, spoken words
  stay bright — no bounce, no colour flashes (restrained documentary tone).

  States change through gsap.set({ className }) on the paused timeline — seek-safe.
-->
<script src="assets/vendor/gsap.min.js"></script>

<style data-brand-tokens></style>

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* Caption band: y 1450–1670. The group is bottom-anchored so one- and two-line groups share a baseline edge. */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: 1450px;
    height: 220px;
  }
  .caption-group {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
  }
  .caption-pill {
    max-width: 860px;
    padding: 14px 34px 20px;
    background: rgba(18, 17, 16, 0.93);
    border-top: 2px solid rgba(255, 90, 31, 0.85);
    border-radius: 0;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.02em 0.28em;
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 700;
    font-size: 60px;
    line-height: 1.12;
    letter-spacing: -0.005em;
    text-align: center;
  }
  /* upcoming words: dimmed but still ≥ 3:1 on the plate (WCAG large text), even over the ember flood */
  .caption-word {
    display: inline-block;
    color: #7c7870;
  }
  .caption-word.is-active {
    color: #ece7de;
  }
  .caption-word.is-spoken {
    color: rgba(236, 231, 222, 0.92);
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="0"
  data-fps="30"
  data-width="0"
  data-height="0"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // captions.mjs injects the word-synced groups + the real duration here.
  var GROUPS = [];
  var DURATION = 0;

  (function () {
    var stage = document.getElementById("caption-stage");

    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast
        ? Math.min(DURATION, Number(group.end) + 0.6)
        : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start);
        tl.set(el, { className: "caption-word is-active" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt);
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the captions timeline covers the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["captions"] = tl;
  })();
</script>
