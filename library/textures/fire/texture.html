<!-- hygen texture fire (from the crater glow of scale-gauge and the ember bloom of counter-title, Pompeii).
     Contract: library/scenes/CONTRACT.md, «Текстуры». -->
<template id="__p__-template">
<div id="root" data-composition-id="__cid__" data-start="0" data-duration="{{hygen:duration}}" data-width="1080" data-height="1920">
  <style>
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    #__p__-c { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <canvas id="__p__-c" class="clip" width="540" height="960" data-start="0" data-duration="{{hygen:duration}}" data-track-index="0"></canvas>
</div>
<script src="assets/vendor/gsap.min.js"></script>
<script>
(function () {
  /*{{hygen:params}}*/
  var ctx = document.getElementById("__p__-c").getContext("2d");
  var W = 1080, H = 1920, TAU = Math.PI * 2;
  function rand(n) { var x = Math.sin((n + SEED * 101.3) * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  var CX = P.x * W, CY = P.y * H, K = P.flicker;
  var PH = [rand(1.1) * TAU, rand(2.3) * TAU, rand(3.7) * TAU, rand(4.9) * TAU];
  function flick(t) {
    return K === 0 ? 0 : 0.5 * Math.sin(t * 6.1 * K + PH[0]) + 0.3 * Math.sin(t * 9.7 * K + 1.3 + PH[1]) + 0.2 * Math.sin(t * 3.3 * K + 0.4 + PH[2]);
  }
  function blob(x, y, rx, ry, rgb, a, mid) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1, ry / rx);
    var g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    g.addColorStop(0, "rgba(" + rgb + "," + a.toFixed(3) + ")");
    g.addColorStop(0.45, "rgba(" + rgb + "," + (a * mid).toFixed(3) + ")");
    g.addColorStop(1, "rgba(" + rgb + ",0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, rx, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, 540, 960);
    ctx.setTransform(0.5, 0, 0, 0.5, 0, 0);
    var f = flick(t), I = P.intensity / 0.6;
    if (P.mode === "crater") {
      var rad = (116 + 5 * f) * P.size;
      var al = Math.min(0.45, 0.4 + 0.05 * f) * I;
      blob(CX, CY, rad * 2.2, rad * 2.2, P.colorRgb, al * 0.35, 0.3);
      blob(CX, CY, rad, rad, P.colorRgb, al, 0.4);
      ctx.globalAlpha = clamp01(0.92 + 0.18 * f) * clamp01(I);
      ctx.fillStyle = P.hot;
      ctx.beginPath(); ctx.ellipse(CX, CY + 1, 56 * P.size, 4 * P.size, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (P.mode === "horizon") {
      for (var k = 0; k < 6; k++) {
        var bx = W * ((k + 0.5) / 6) + 46 * Math.sin(t * 0.3 * (K || 1) + PH[k % 4] + k);
        var nk = 0.5 + 0.5 * Math.sin(t * (2.1 + 0.7 * k) * (K || 0.001) + PH[(k + 1) % 4]);
        blob(bx, CY + 180 * P.size, 360 * P.size, 300 * P.size, P.colorRgb, (0.26 + 0.12 * nk) * I, 0.45);
      }
      blob(CX, CY + 260 * P.size, 900 * P.size, 220 * P.size, P.hotRgb, (0.2 + 0.05 * f) * I, 0.35);
    } else {
      var br = 1 + 0.015 * Math.sin(t * 2.3 + PH[0]) + 0.01 * f;
      blob(CX, CY, 520 * P.size * br, 460 * P.size * br, P.colorRgb, (0.4 + 0.024 * Math.sin(t * 1.7 + PH[1])) * I, 0.6);
    }
  }
  var tl = gsap.timeline({ paused: true });
  var clock = { t: 0 };
  draw(0);
  tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["__cid__"] = tl;
})();
</script>
</template>
