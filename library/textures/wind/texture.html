<template id="__p__-template">
<div id="root" data-composition-id="__cid__" data-start="0" data-duration="{{hygen:duration}}" data-width="1080" data-height="1920">
  <style>
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    #__p__-c { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <canvas id="__p__-c" class="clip" width="540" height="960" data-start="0" data-duration="{{hygen:duration}}" data-track-index="0"></canvas>
</div>
<script src="assets/vendor/gsap.min.js"></script>
<script>
(function () {
  /*{{hygen:params}}*/
  var ctx = document.getElementById("__p__-c").getContext("2d");
  var W = 1080, H = 1920, TAU = Math.PI * 2;
  function rand(n) { var x = Math.sin((n + SEED * 101.3) * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  var DIR = P.direction === "right" ? 1 : -1;
  var ANG = (P.angle * Math.PI) / 180, DX = Math.cos(ANG) * DIR, DY = Math.sin(ANG);
  var N = Math.round(160 * P.density);
  var S2 = [];
  for (var i = 0; i < N; i++) {
    var near = Math.pow(rand(i * 1.7 + 0.2), 1.6);
    S2.push({
      y: -200 + rand(i * 2.9 + 1.3) * (H + 400), off: rand(i * 3.1 + 2.7),
      v: (380 + 900 * near) * P.speed, len: (60 + 260 * near) * P.length, w: 1 + 2.4 * near,
      a: 0.25 + 0.6 * near, gph: rand(i * 4.3 + 0.9) * TAU
    });
  }
  var SPAN = W + 700;
  function gust(t, ph) {
    var g = 0.5 + 0.5 * Math.sin(t * 0.9 + ph) * Math.sin(t * 0.37 + ph * 1.7);
    return 1 - P.gust + P.gust * g;
  }
  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, 540, 960);
    ctx.setTransform(0.5, 0, 0, 0.5, 0, 0);
    ctx.strokeStyle = P.color;
    ctx.lineCap = "round";
    for (var i = 0; i < S2.length; i++) {
      var s = S2[i];
      var p = ((s.off * SPAN + s.v * t) % SPAN) - 350;
      var hx = DIR < 0 ? W - p : p;
      var hy = s.y + p * DY;
      var a = s.a * gust(t, s.gph);
      if (a < 0.02) continue;
      var tx = hx - DX * s.len, ty = hy - DY * s.len;
      ctx.lineWidth = s.w;
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx - DX * s.len * 0.35, hy - DY * s.len * 0.35); ctx.stroke();
      ctx.globalAlpha = a * 0.35;
      ctx.beginPath(); ctx.moveTo(hx - DX * s.len * 0.35, hy - DY * s.len * 0.35); ctx.lineTo(tx, ty); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  var tl = gsap.timeline({ paused: true });
  var clock = { t: 0 };
  draw(0);
  tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["__cid__"] = tl;
})();
</script>
