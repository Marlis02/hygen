<!-- hygen texture paper (D6): crumpled paper drawn once into an offscreen sheet — uneven tone, creases as a shade band
     against a highlight band with a thin fold line, fibres, strips of tape with torn ends — and blitted every frame with a
     small seeded print offset stepping 8 times a second. Blend multiply: the paper sits a touch below white, so creases
     shade the frame and their highlights read as lighter paper. Contract: library/scenes/CONTRACT.md, «Текстуры». -->
<template id="__p__-template">
<div id="root" data-composition-id="__cid__" data-start="0" data-duration="{{hygen:duration}}" data-width="1080" data-height="1920">
  <style>
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
    #__p__-c { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <canvas id="__p__-c" class="clip" width="540" height="960" data-start="0" data-duration="{{hygen:duration}}" data-track-index="0"></canvas>
</div>
<script src="assets/vendor/gsap.min.js"></script>
<script>
(function () {
  /*{{hygen:params}}*/
  var ctx = document.getElementById("__p__-c").getContext("2d");
  var W = 540, H = 960, M = 8;
  function rand(n) { var x = Math.sin((n + SEED * 101.3) * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function ink(rgb, a) { return "rgba(" + rgb + "," + Math.max(0, Math.min(1, a)).toFixed(3) + ")"; }
  var sheet = document.createElement("canvas");
  sheet.width = W + 2 * M;
  sheet.height = H + 2 * M;
  var g = sheet.getContext("2d");
  var SW = sheet.width, SH = sheet.height;

  // the sheet, a touch below the paper colour; uneven tone in soft lighter clouds
  g.fillStyle = ink(P.colorRgb, 1);
  g.fillRect(0, 0, SW, SH);
  g.fillStyle = ink(S.rgb.black, 0.045 + 0.04 * P.crumple);
  g.fillRect(0, 0, SW, SH);
  for (var u = 0; u < 6; u++) {
    var gx = rand(u * 3.1 + 0.2) * SW, gy = rand(u * 5.7 + 1.3) * SH, gr = 160 + 240 * rand(u * 7.9 + 2.1);
    var rg = g.createRadialGradient(gx, gy, 0, gx, gy, gr);
    rg.addColorStop(0, ink(S.rgb.white, 0.06 + 0.05 * rand(u * 1.9 + 0.4)));
    rg.addColorStop(1, ink(S.rgb.white, 0));
    g.fillStyle = rg;
    g.fillRect(0, 0, SW, SH);
  }

  // creases: across a line the paper falls into shade on one side and catches the light on the other
  var N = Math.round(3 + 22 * P.crumple);
  for (var i = 0; i < N; i++) {
    var ang = rand(i * 11.3 + 4.4) * Math.PI;
    var px = rand(i * 13.7 + 0.9) * SW, py = rand(i * 17.1 + 2.6) * SH;
    var nx = Math.cos(ang + Math.PI / 2), ny = Math.sin(ang + Math.PI / 2);
    var half = 8 + 44 * rand(i * 19.3 + 5.1);
    var depth = (0.05 + 0.12 * rand(i * 23.9 + 1.7)) * (0.35 + 0.65 * P.crumple);
    var len = 260 + 620 * rand(i * 29.1 + 3.3), dx = Math.cos(ang) * len, dy = Math.sin(ang) * len;
    var lg = g.createLinearGradient(px - nx * half, py - ny * half, px + nx * half, py + ny * half);
    lg.addColorStop(0, ink(S.rgb.black, 0));
    lg.addColorStop(0.47, ink(S.rgb.black, depth));
    lg.addColorStop(0.53, ink(S.rgb.white, depth * 1.5));
    lg.addColorStop(1, ink(S.rgb.white, 0));
    g.beginPath();
    g.moveTo(px - dx - nx * half, py - dy - ny * half);
    g.lineTo(px + dx - nx * half, py + dy - ny * half);
    g.lineTo(px + dx + nx * half, py + dy + ny * half);
    g.lineTo(px - dx + nx * half, py - dy + ny * half);
    g.closePath();
    g.fillStyle = lg;
    g.fill();
    g.strokeStyle = ink(S.rgb.black, depth * 0.8);
    g.lineWidth = 0.7;
    g.beginPath();
    g.moveTo(px - dx * 0.85, py - dy * 0.85);
    g.lineTo(px + dx * 0.85, py + dy * 0.85);
    g.stroke();
  }

  // fibres
  for (var f = 0; f < 1100; f++) {
    g.fillStyle = ink(S.rgb.black, 0.025 + 0.045 * rand(f * 2.3 + 0.7));
    g.fillRect(rand(f * 1.13 + 7.7) * SW, rand(f * 1.71 + 9.1) * SH, 0.8 + rand(f * 3.1 + 0.2) * 2.2, 0.6);
  }

  // tape: translucent strips with torn ends across the corners
  var corners = [[0, 0, 1, 1], [SW, 0, -1, 1], [SW, SH, -1, -1], [0, SH, 1, -1]];
  for (var k = 0; k < P.tape; k++) {
    var c = corners[k];
    var tw = 120 + 36 * rand(k * 5.3 + 1.1), th = 30 + 8 * rand(k * 6.1 + 2.2);
    var rot = (c[2] * c[3] > 0 ? -45 : 45) + (rand(k * 7.7 + 0.3) - 0.5) * 18;
    g.save();
    g.translate(c[0] + c[2] * 30, c[1] + c[3] * 30);
    g.rotate((rot * Math.PI) / 180);
    g.beginPath();
    g.moveTo(-tw / 2, -th / 2);
    g.lineTo(tw / 2, -th / 2);
    for (var z = 1; z <= 6; z++) g.lineTo(tw / 2 + (z % 2 ? 3 : -2) * (0.6 + rand(k * 3.3 + z)), -th / 2 + (th * z) / 6);
    g.lineTo(-tw / 2, th / 2);
    for (var z2 = 5; z2 >= 0; z2--) g.lineTo(-tw / 2 + (z2 % 2 ? -3 : 2) * (0.6 + rand(k * 4.1 + z2)), -th / 2 + (th * z2) / 6);
    g.closePath();
    g.fillStyle = ink(P.tapeColorRgb, 0.42);
    g.fill();
    g.strokeStyle = ink(S.rgb.black, 0.07);
    g.lineWidth = 1;
    g.stroke();
    g.restore();
  }

  function draw(t) {
    var step = Math.floor(t * 8);
    var ox = P.offset > 0 ? (rand(step * 3.7 + 0.5) - 0.5) * 3 * P.offset : 0;
    var oy = P.offset > 0 ? (rand(step * 5.9 + 1.5) - 0.5) * 3 * P.offset : 0;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(sheet, -M + ox, -M + oy);
  }
  var tl = gsap.timeline({ paused: true });
  var clock = { t: 0 };
  draw(0);
  tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["__cid__"] = tl;
})();
</script>
</template>
