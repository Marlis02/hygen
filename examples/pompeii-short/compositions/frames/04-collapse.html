<script>
(function () {
  var DUR = 9.258;
  var byId = function (id) { return document.getElementById(id); };
  var camera = byId("f04-collapse-camera");
  var colCanvas = byId("f04-collapse-column");
  var flood = byId("f04-collapse-flood");
  var fxCanvas = byId("f04-collapse-fx");
  var marker = byId("f04-collapse-marker");
  var sCells = [byId("f04-collapse-s0"), byId("f04-collapse-s1"), byId("f04-collapse-s2")];
  var digitL = byId("f04-collapse-dl");
  var digitR = byId("f04-collapse-dr");
  var colCtx = colCanvas.getContext("2d");
  var fxCtx = fxCanvas.getContext("2d");

  // ---------- deterministic helpers (index-seeded hash only) ----------
  function prand(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function seg(t, a, b) { return clamp01((t - a) / (b - a)); }
  function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }
  var P1IO = gsap.parseEase("power1.inOut");
  var P2IO = gsap.parseEase("power2.inOut");
  var P2O = gsap.parseEase("power2.out");
  var P3O = gsap.parseEase("power3.out");
  var SIO = gsap.parseEase("sine.inOut");

  // ---------- Scenes 1–2: the ash column and its collapse (canvas) ----------
  // Frame coordinates are 1080×1920; canvases are half-res backing stores over a 60 px bleed.
  var CRX = 240, CRY = 600;          // vent: centre of the flat summit
  var VT = 1150, KD = 0.32;          // collapse: terminal fall speed (px/s) and drag constant (s)
  var LAYER_COLORS = ["#121110", "#3A3835", "#5A5650", "#8C877F"];
  var layers = [[], [], [], []];
  var N_ASH = 1100;
  for (var i = 0; i < N_ASH; i++) {
    var umb = prand(i * 3.7 + 1.1) < 0.32;
    var p = {};
    if (!umb) {
      var u = prand(i * 1.13 + 0.7);                       // 0 = vent … 1 = where the canopy starts
      var half = 22 + 150 * Math.pow(u, 0.85);
      p.hx = CRX + (prand(i * 5.3 + 2.9) + prand(i * 7.1 + 0.3) - 1) * half * 1.2;
      p.hy = CRY - 360 * u;
      p.r = 6 + 20 * Math.pow(prand(i * 9.7 + 4.1), 1.5) + 8 * u;
      p.a = 0.2 + 0.3 * prand(i * 2.3 + 5.5);
      p.v = 16 + 30 * prand(i * 6.9 + 1.3);
      p.spread = 0;
      p.ta = 4 + 10 * u;
      p.out = (p.hx - CRX) * 0.35 + (prand(i * 12.7 + 0.9) - 0.5) * 60;
    } else {
      var sx = prand(i * 4.1 + 6.2) + prand(i * 8.3 + 1.7) - 1; // −1 … 1, dense at the centre
      var thick = 95 * (1 - 0.55 * Math.abs(sx));
      p.hx = CRX + sx * 420;
      p.hy = 168 + 40 * sx * sx + (prand(i * 4.9 + 3.3) * 2 - 1) * thick; // umbrella canopy, drooping edges
      p.r = 10 + 22 * Math.pow(prand(i * 9.7 + 4.1), 1.3);
      p.a = 0.16 + 0.28 * prand(i * 2.3 + 5.5);
      p.v = 4 + 8 * prand(i * 6.9 + 1.3);
      p.spread = sx * 34;
      p.ta = 5 + 7 * prand(i * 3.3 + 2.1);
      p.out = (p.hx - CRX) * 0.18 + (prand(i * 12.7 + 0.9) - 0.5) * 50;
    }
    p.w = 0.8 + 1.4 * prand(i * 15.1 + 0.4);
    p.ph = prand(i * 16.3 + 8.8) * 6.2832;
    p.tc = 0.95 + 0.16 * prand(i * 6.1 + 2.2);             // collapse onset, on «колонна обрушивается»
    p.lift = 8 + 70 * Math.pow(prand(i * 10.3 + 6.6), 1.8) + p.r * 0.4;
    p.slide = 120 + 520 * prand(i * 11.3 + 3.9);
    p.side = prand(i * 13.7 + 5.1) < 0.62 ? 1 : -1;        // summit spill favours the city side
    p.bob = prand(i * 14.9 + 2.7) * 6.2832;
    var lr = prand(i * 2.9 + 7.7);
    var layer = lr < 0.15 ? 0 : lr < 0.4 ? 1 : lr < 0.78 ? 2 : 3;
    p.c = LAYER_COLORS[layer];
    layers[layer].push(p);
  }
  var PARTS = layers[0].concat(layers[1], layers[2], layers[3]); // back (dark) → front (light)

  var SPARKS = [];
  for (var k = 0; k < 60; k++) {
    var su = 0.3 * prand(k * 5.9 + 8.1);
    var shalf = 22 + 150 * Math.pow(su, 0.85);
    SPARKS.push({
      hx: CRX + (prand(k * 3.3 + 1.9) + prand(k * 6.1 + 4.4) - 1) * shalf,
      hy: CRY - 360 * su, u: su / 0.3, r: 1.5 + 2 * prand(k * 7.7 + 2.2),
      v: 30 + 40 * prand(k * 2.1 + 9.3), spread: 0, ta: 4, w: 1.2,
      ph: prand(k * 9.4 + 1.1) * 6.2832, fl: 9 + 6 * prand(k * 1.7 + 6.3),
      out: (prand(k * 8.8 + 3.1) - 0.5) * 90, tc: 0.95 + 0.12 * prand(k * 4.6 + 0.2),
      lift: 10 + 30 * prand(k * 5.2 + 7.4), slide: 100 + 300 * prand(k * 6.6 + 5.8),
      side: prand(k * 3.9 + 2.6) < 0.6 ? 1 : -1, bob: prand(k * 4.4 + 3.6) * 6.2832
    });
  }

  // Cone surface height at x (summit flat 180–300 at y 600, base y 1250 at x −120 / 760, then a low plain).
  function surfaceY(x) {
    if (x <= 180) return 600 + (180 - x) * 2.16667;
    if (x < 300) return 600;
    if (x <= 760) return 600 + (x - 300) * 1.41304;
    return 1250 + (x - 760) * 0.36;
  }
  // Integral of the rising-speed factor: 1 until 0.6 s, linear stall to 0 at 1.0 s.
  function riseInt(t) {
    if (t < 0.6) return t;
    if (t < 1.0) { var d = t - 0.6; return 0.6 + d - d * d / 0.8; }
    return 0.8;
  }
  // Position of one particle at time t — a pure function (billow → stall → drag fall → land → slide down-slope).
  var PX = 0, PY = 0;
  function place(q, t) {
    var ri = riseInt(t);
    var x = q.hx + Math.sin(t * q.w + q.ph) * q.ta + q.spread * ri;
    var y = q.hy - q.v * ri;
    var tau = t - q.tc;
    if (tau > 0) {
      x += q.out * (1 - Math.exp(-tau / 0.7));
      y += VT * (tau - KD * (1 - Math.exp(-tau / KD)));
      var lift = q.lift * smooth(tau / 0.25);
      var floorY = surfaceY(x) - lift;
      if (y > floorY) {
        var s = q.slide * (1 - Math.exp(-(y - floorY) / 420));
        var side = x < 180 ? -1 : x > 300 ? 1 : q.side;
        var x2;
        if (side > 0) {
          var dR = Math.max(0, 300 - x);
          x2 = s <= dR ? x + s : Math.max(x, 300) + (s - dR) * 0.5777;
        } else {
          var dL = Math.max(0, x - 180);
          x2 = s <= dL ? x - s : Math.min(x, 180) - (s - dL) * 0.4191;
        }
        x = x2;
        y = surfaceY(x2) - lift * (1 + 0.22 * Math.sin(t * 1.7 + q.bob) * Math.min(1, s / 60));
      }
    }
    PX = x; PY = y;
  }

  function drawColumn(t) {
    colCtx.setTransform(1, 0, 0, 1, 0, 0);
    colCtx.clearRect(0, 0, 600, 1020);
    if (t >= 4.35) return; // the flood covers the whole frame from 4.20 s
    colCtx.setTransform(0.5, 0, 0, 0.5, 30, 30);
    for (var n = 0; n < PARTS.length; n++) {
      var q = PARTS[n];
      place(q, t);
      if (PY < -140 || PY > 2010 || PX < -180 || PX > 1260) continue;
      colCtx.globalAlpha = q.a;
      colCtx.fillStyle = q.c;
      colCtx.beginPath();
      colCtx.arc(PX, PY, q.r, 0, 6.2832);
      colCtx.fill();
    }
    var sparkFade = 1 - smooth((t - 1.05) / 0.75);
    if (sparkFade > 0) {
      colCtx.fillStyle = "#FF5A1F";
      for (var m = 0; m < SPARKS.length; m++) {
        var sp = SPARKS[m];
        place(sp, t);
        var flick = 0.55 + 0.45 * Math.sin(t * sp.fl + sp.ph);
        colCtx.globalAlpha = Math.max(0, (1 - sp.u) * flick * sparkFade * 0.9);
        colCtx.beginPath();
        colCtx.arc(PX, PY, sp.r, 0, 6.2832);
        colCtx.fill();
      }
    }
    // vent glow: smoulders, is choked by the collapse, then re-ignites just before the avalanche (same-hue bloom ≤ 0.45)
    var g = Math.min(0.45, 0.28 * (1 - smooth((t - 0.9) / 0.8)) + 0.45 * smooth((t - 1.75) / 0.63));
    if (g > 0.003) {
      var gr = 80 + 110 * smooth((t - 1.75) / 0.63);
      var grad = colCtx.createRadialGradient(CRX, CRY - 6, 0, CRX, CRY - 6, gr);
      grad.addColorStop(0, "rgba(255,90,31," + g.toFixed(3) + ")");
      grad.addColorStop(1, "rgba(255,90,31,0)");
      colCtx.globalAlpha = 1;
      colCtx.fillStyle = grad;
      colCtx.beginPath();
      colCtx.arc(CRX, CRY - 6, gr, 0, 6.2832);
      colCtx.fill();
    }
    colCtx.globalAlpha = 1;
  }

  // ---------- Scene 3: the ember flood (jagged clip-path front + patches + hot rim) ----------
  var NV = 144, FX0 = 240, FY0 = 600, TH0 = Math.atan2(650, 460); // rays from the summit; ray 0 points down the slope
  var TH = [], REND = [], TARR = [];
  for (var j = 0; j < NV; j++) {
    var phi = (j / NV) * Math.PI * 2;
    var th = TH0 + phi;
    var ex = Math.cos(th), ey = Math.sin(th);
    var tx = ex > 1e-6 ? (1140 - FX0) / ex : ex < -1e-6 ? (-60 - FX0) / ex : 1e9;
    var ty = ey > 1e-6 ? (1980 - FY0) / ey : ey < -1e-6 ? (-60 - FY0) / ey : 1e9;
    var aa = (1 + Math.cos(phi)) / 2;                    // 1 = down-slope toward the city, 0 = up-slope
    TH.push(th);
    REND.push(Math.min(tx, ty) + 150);                   // radius that fully covers the bleed box on this ray
    TARR.push(1.82 - 0.75 * aa * aa * aa);               // down-slope tongue arrives first; everything covered by 4.20 s
  }
  var FPX = new Float64Array(NV), FPY = new Float64Array(NV);
  // Seeded 2-D value noise: x = ray index (wraps with `period` so the polygon closes), y = time.
  function vnoise(x, period, y, seed) {
    var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    var x0 = ((xi % period) + period) % period, x1 = (x0 + 1) % period;
    var h00 = prand(x0 * 157.31 + yi * 311.17 + seed * 71.93) * 2 - 1;
    var h10 = prand(x1 * 157.31 + yi * 311.17 + seed * 71.93) * 2 - 1;
    var h01 = prand(x0 * 157.31 + (yi + 1) * 311.17 + seed * 71.93) * 2 - 1;
    var h11 = prand(x1 * 157.31 + (yi + 1) * 311.17 + seed * 71.93) * 2 - 1;
    var sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf);
    var top = h00 + (h10 - h00) * sx, bot = h01 + (h11 - h01) * sx;
    return top + (bot - top) * sy;
  }
  function floodShape(t) {
    var u = t - 2.38, pts = [];
    for (var n = 0; n < NV; n++) {
      var r = REND[n] * Math.pow(clamp01(u / TARR[n]), 1.6);   // breaks loose slowly, then races
      var amp = Math.min(1, r / 260) * (30 + 0.045 * r);
      var nz = 0.55 * vnoise(n / 6, 24, t * 1.15, 1) + 0.3 * vnoise(n / 3, 48, t * 2.4, 2) + 0.15 * vnoise(n, 144, t * 4.3, 3);
      var rr = Math.max(0, r + amp * nz);
      var x = FX0 + 60 + Math.cos(TH[n]) * rr;               // flood-box local coordinates (+60 bleed)
      var y = FY0 + 60 + Math.sin(TH[n]) * rr;
      FPX[n] = x; FPY[n] = y;
      pts.push(x.toFixed(1) + "px " + y.toFixed(1) + "px");
    }
    return "polygon(" + pts.join(",") + ")";
  }
  var PATCHES = [];
  for (var pk = 0; pk < 9; pk++) {
    PATCHES.push({
      x0: -80 + prand(pk * 3.1 + 0.5) * 1320, y0: -60 + prand(pk * 5.7 + 1.5) * 2000,
      vx: 26 + prand(pk * 2.3 + 4.1) * 30, vy: 36 + prand(pk * 6.7 + 2.9) * 40,
      R: 190 + prand(pk * 8.9 + 3.3) * 230, asp: 0.5 + prand(pk * 4.4 + 7.1) * 0.4,
      rot0: prand(pk * 9.1 + 5.5) * Math.PI, spin: (prand(pk * 1.9 + 8.3) - 0.5) * 0.5,
      ph: prand(pk * 7.3 + 9.9) * 6.2832
    });
  }
  function drawFx(t, cool) {
    fxCtx.setTransform(1, 0, 0, 1, 0, 0);
    fxCtx.clearRect(0, 0, 600, 1020);
    if (t < 2.38) return;
    fxCtx.setTransform(0.5, 0, 0, 0.5, 0, 0);
    var A = smooth((t - 2.38) / 0.5) * (1 - cool);          // patches die as the fire cools
    if (A > 0.002) {
      var dt = t - 2.38;
      for (var n = 0; n < PATCHES.length; n++) {
        var pa = PATCHES[n];
        var cx = pa.x0 + pa.vx * dt + 50 * Math.sin(0.6 * t + pa.ph) + 60;
        var cy = pa.y0 + pa.vy * dt + 40 * Math.cos(0.5 * t + pa.ph * 1.3) + 60;
        var R = pa.R * (1 + 0.08 * Math.sin(0.9 * t + pa.ph));
        fxCtx.save();
        fxCtx.translate(cx, cy);
        fxCtx.rotate(pa.rot0 + pa.spin * t);
        fxCtx.scale(1, pa.asp);
        var g = fxCtx.createRadialGradient(0, 0, 0, 0, 0, R);
        g.addColorStop(0, "rgba(122,34,8," + (0.35 * A).toFixed(3) + ")");
        g.addColorStop(0.55, "rgba(122,34,8," + (0.24 * A).toFixed(3) + ")");
        g.addColorStop(1, "rgba(122,34,8,0)");
        fxCtx.fillStyle = g;
        fxCtx.beginPath();
        fxCtx.arc(0, 0, R, 0, 6.2832);
        fxCtx.fill();
        fxCtx.restore();
      }
    }
    if (t < 4.45) {                                          // hot leading edge; half the stroke is clipped away → ~24 px rim
      fxCtx.beginPath();
      fxCtx.moveTo(FPX[0], FPY[0]);
      for (var e = 1; e < NV; e++) fxCtx.lineTo(FPX[e], FPY[e]);
      fxCtx.closePath();
      fxCtx.lineJoin = "round";
      fxCtx.strokeStyle = "rgba(255,140,80,0.16)";
      fxCtx.lineWidth = 150;
      fxCtx.stroke();
      fxCtx.strokeStyle = "rgba(255,140,80,0.6)";
      fxCtx.lineWidth = 48;
      fxCtx.stroke();
    }
  }
  // Scene 4 cooling: ember → ash-mid → ash along one power2.inOut progress.
  function floodColor(k) {
    var a = k < 0.5 ? [255, 90, 31] : [90, 86, 80];
    var b = k < 0.5 ? [90, 86, 80] : [46, 44, 41];
    var f = k < 0.5 ? k / 0.5 : (k - 0.5) / 0.5;
    return "rgb(" + Math.round(a[0] + (b[0] - a[0]) * f) + "," + Math.round(a[1] + (b[1] - a[1]) * f) + "," + Math.round(a[2] + (b[2] - a[2]) * f) + ")";
  }

  // ---------- multi-phase camera: phase scale + Lissajous drift + impact rumble, ONE writer ----------
  function envelope(t, t0, rise, len) {
    if (t <= t0) return 0;
    var d = t - t0;
    if (d < rise) return smooth(d / rise);
    var q = (d - rise) / len;
    return q >= 1 ? 0 : Math.exp(-3 * q) * (1 - q);
  }
  function cameraAt(t) {
    var s = 1
      + 0.020 * P1IO(seg(t, 0.60, 2.38))    // phase 1: creeping anticipation while the column falls
      + 0.055 * P2IO(seg(t, 2.38, 4.40))    // phase 2: push with the surge
      - 0.055 * P2IO(seg(t, 6.25, 7.55))    // phase 3: release as the fire cools (lands before the depth reveals)
      + 0.016 * SIO(seg(t, 7.55, DUR));     // phase 4: heavy slow push under the stillness
    var p = (t / DUR) * Math.PI * 3;         // 1.5 drift cycles across the frame
    var dx = Math.sin(p) * 5;
    var dy = (Math.sin(p * 1.3 + 0.6) - 1) * 1.6; // ≤ 0: the ground line never drops below y 1420
    var sh = 3.5 * envelope(t, 0.30, 0.05, 0.55) + 5 * envelope(t, 2.38, 0.18, 1.5); // thud under the white peak; avalanche rumble
    var sx = sh * (0.7 * Math.sin(t * 58.4) + 0.3 * Math.sin(t * 92.4 + 1.1));
    var sy = sh * 0.8 * (0.7 * Math.sin(t * 74.8 + 0.4) + 0.3 * Math.sin(t * 44.6 + 2.3));
    camera.style.transform = "translate(" + (dx + sx).toFixed(2) + "px," + (dy + sy).toFixed(2) + "px) scale(" + s.toFixed(4) + ")";
  }

  // ---------- Scene 5: strata stack top (same windows + ease as the band tweens) ----------
  var BAND_H = [126, 90, 117, 108, 99], BAND_T0 = 6.55, BAND_STEP = 0.4025, BAND_D = 0.35;
  function stackTop(t) {
    var y = 1420;
    for (var b = 0; b < 5; b++) {
      var s0 = BAND_T0 + b * BAND_STEP;
      y -= BAND_H[b] * P2O(seg(t, s0, s0 + BAND_D));
    }
    return y;
  }

  // Counter values are written from the master clock (pure function of t), so a seek that jumps
  // across a short count window can never leave a stale digit on screen.
  function countAt(t, t0, dur, ease, target) { return Math.round(target * ease(seg(t, t0, t0 + dur))); }
  function writeCounters(t) {
    var v = countAt(t, 4.28, 0.8, P3O, 100);                // lands on «километров» (5.08)
    sCells[0].textContent = String(v % 10);
    sCells[1].textContent = v >= 10 ? String(Math.floor(v / 10) % 10) : "";
    sCells[2].textContent = v >= 100 ? String(Math.floor(v / 100)) : "";
    digitL.textContent = String(countAt(t, 7.90, 0.30, P2O, 4));  // «четыре»
    digitR.textContent = String(countAt(t, 8.08, 0.32, P2O, 6));  // 8.08 → 8.40
  }

  function renderAt(t) {
    cameraAt(t);
    drawColumn(t);
    var cool = P2IO(seg(t, 6.25, 7.25));
    if (t < 2.38) {
      flood.style.opacity = "0";
    } else {
      flood.style.opacity = "1";
      flood.style.clipPath = t < 4.45 ? floodShape(t) : "none";
      flood.style.backgroundColor = floodColor(cool);
    }
    drawFx(t, cool);
    var my = Math.min(stackTop(t), 1408);                  // marker rides the top of the layers, never below y 1420
    marker.style.transform = "translate(0px," + (my - 1420).toFixed(2) + "px)";
    writeCounters(t);
  }

  // ---------- timeline ----------
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  // Master clock: one proxy tween, ease "none"; canvas, flood mask, camera, marker and counter text are redrawn from t.
  var clock = { t: 0 };
  tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { renderAt(clock.t); } }, 0);

  // Scene 1 (0–0.60): continuation under the white flash — the standing column is drawn at t = 0, nothing reveals.
  // Scene 2 (0.60–2.30): «колонна обрушивается» — the sky blackens while the column falls onto the slopes.
  tl.fromTo(byId("f04-collapse-sky"), { opacity: 0.5 }, { opacity: 0.84, duration: 1.3, ease: "power1.inOut" }, 1.0);

  // Scene 3 (2.38–5.72): flood runs from the master clock; «≈ 100 КМ/Ч» lockup.
  var speedNum = byId("f04-collapse-speed-num");
  tl.fromTo(speedNum, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 4.28);
  tl.fromTo(speedNum, { scale: 0.7 }, { scale: 1, duration: 0.8, ease: "power3.out" }, 4.28); // same window + ease as the count
  tl.fromTo(byId("f04-collapse-approx"), { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 4.61); // «около»
  tl.fromTo(byId("f04-collapse-speed-unit"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 5.64); // «в час»

  // Scene 4 (6.25–7.30): «Город запечатывает» — fire cools (master clock); the speed lockup dims out.
  // In-frame change dictated by the storyboard, not a frame exit (the depth lockup takes over the screen).
  tl.fromTo(byId("f04-collapse-speed"), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power1.inOut", immediateRender: false }, 6.25);

  // Scene 5 (6.55–8.86): strata rise band by band from the ground line, gauge + depth lockup.
  for (var b = 0; b < 5; b++) {
    tl.fromTo(byId("f04-collapse-b" + b), { scaleY: 0 }, { scaleY: 1, duration: BAND_D, ease: "power2.out" }, BAND_T0 + b * BAND_STEP);
  }
  tl.fromTo(byId("f04-collapse-axis"), { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power2.out" }, 6.55);
  for (var m = 0; m <= 6; m++) {
    // each tick lights as the drawing axis passes it (inverse of the axis' power2.out)
    tl.fromTo(byId("f04-collapse-t" + m), { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out" }, 6.55 + 0.6 * (1 - Math.sqrt(1 - m / 6)));
  }
  tl.fromTo(marker, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 6.55);
  tl.fromTo(byId("f04-collapse-depth-label"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 7.34); // «слой»
  tl.fromTo(byId("f04-collapse-range"), { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.45, ease: "power2.out" }, 7.82);
  tl.fromTo(digitL, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 7.90); // «четыре»
  tl.fromTo(digitL, { scale: 0.82 }, { scale: 1, duration: 0.30, ease: "power2.out" }, 7.90);
  tl.fromTo(byId("f04-collapse-dash"), { opacity: 0, scaleX: 0.15 }, { opacity: 1, scaleX: 1, duration: 0.18, ease: "power2.out" }, 8.00);
  tl.fromTo(digitR, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 8.08);
  tl.fromTo(digitR, { scale: 0.82 }, { scale: 1, duration: 0.32, ease: "power2.out" }, 8.08);
  tl.fromTo(byId("f04-collapse-dunit"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 8.51); // «метров»

  // Scene 6 (8.86–9.258): heavy hold — only the camera keeps moving (master clock).

  renderAt(0); // first paint: the full-height column over the cone, before any seek
  window.__timelines["04-collapse"] = tl;
})();
</script>
</template>
