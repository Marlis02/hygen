<script>
(function () {
  "use strict";

  var DUR = 7.287;
  var el = function (id) { return document.getElementById(id); };
  var tl = gsap.timeline({ paused: true });

  /* ================= seeded, deterministic helpers ================= */
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function noise1D(seed, len) {
    var r = mulberry32(seed), tab = [];
    for (var i = 0; i < len; i++) tab.push(r() * 2 - 1);
    return function (u) {
      var i0 = Math.floor(u), f = u - i0;
      var a = tab[((i0 % len) + len) % len], b = tab[(((i0 + 1) % len) + len) % len];
      var s = f * f * (3 - 2 * f);
      return a + (b - a) * s;
    };
  }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  var E_P1_INOUT = gsap.parseEase("power1.inOut");
  var E_P2_OUT = gsap.parseEase("power2.out");
  var E_P3_INOUT = gsap.parseEase("power3.inOut");
  var E_SINE_INOUT = gsap.parseEase("sine.inOut");
  // eased 0→1 progress of a segment — every derived value below is a pure function of timeline time
  function seg(t, start, dur, ease) { return ease(clamp01((t - start) / dur)); }

  /* ================= ash surface (static seeded speckle) ================= */
  var ASH_OFF = 60, ASH_W = 1200, ASH_H = 2040;
  var MX = 180, MY = 535, MW = 720, MH = 370;
  var SPECK_COLORS = ["#3A3835", "#5A5650", "#8C877F"];

  var specks = (function () {
    var r = mulberry32(1748);
    var n1 = noise1D(51, 97), n2 = noise1D(83, 89);
    var list = [];
    for (var i = 0; i < 12000; i++) {
      var x = r() * ASH_W - ASH_OFF;
      var y = r() * ASH_H - ASH_OFF;
      var keep = r();
      var u = r();
      var rad = u < 0.07 ? 1.5 + r() * 1.3 : 0.5 + r() * 0.85;
      var cu = r();
      var col = cu < 0.52 ? 0 : cu < 0.9 ? 1 : 2;
      var alpha = 0.32 + r() * 0.58;
      var dens = 0.5 + 0.25 * n1(x / 140 + y / 610) + 0.25 * n2(y / 170 - x / 530);
      if (keep > dens) continue;
      list.push([x, y, rad, col, alpha]);
    }
    return list;

      ctx.fillStyle = SPECK_COLORS[s[3]];
      ctx.beginPath();
      ctx.arc(s[0] + ox, s[1] + oy, s[2], 0, Math.PI * 2);
      ctx.fill();

  actx.fillStyle = "#2E2C29";
  actx.fillRect(0, 0, ASH_W, ASH_H);
  paintSpecks(actx, ASH_OFF, ASH_OFF, -ASH_OFF - 4, -ASH_OFF - 4, ASH_W, ASH_H);

    { start: 1.95, dur: 0.33, dir: -1, top: 116, bot: 202 },

  PASSES.forEach(function (ps, k) {
    var nTopA = noise1D(900 + k * 7, 61), nTopB = noise1D(1300 + k * 11, 67);
    var nBotA = noise1D(1700 + k * 13, 71), nBotB = noise1D(2100 + k * 17, 73);
    var wob = mulberry32(2500 + k)() * Math.PI * 2;
    var cols = Math.ceil((XB - XA) / EDGE_STEP) + 2;
    ps.tops = [];
    ps.bots = [];
    for (var i = 0; i < cols; i++) {
      var x = XA + i * EDGE_STEP;
      var w = 3 * Math.sin((x / MW) * Math.PI * 1.4 + wob);
      ps.tops.push(ps.top + w + 6 * nTopA(x / 38 + 5) + 2.5 * nTopB(x / 9 + 3));
      ps.bots.push(ps.bot + w + 6 * nBotA(x / 41 + 9) + 2.5 * nBotB(x / 10 + 1));
    }
    var r = mulberry32(3100 + k * 31);
    ps.lags = [];
    ps.tips = [];
    for (var j = 0; j < BRISTLES; j++) {
      ps.lags.push(r() * 0.2);
      ps.tips.push([(r() - 0.5) * 18, (r() - 0.5) * 18]);
    }
  });

  function edgeAt(arr, x) {
    var u = (x - XA) / EDGE_STEP, i = Math.floor(u);
    if (i < 0) return arr[0];
    if (i >= arr.length - 1) return arr[arr.length - 1];
    return arr[i] + (arr[i + 1] - arr[i]) * (u - i);
  }
  function bandY(ps, x, frac) {
    var a = edgeAt(ps.tops, x), b = edgeAt(ps.bots, x);
    return a + (b - a) * frac;
  }
  // one bristle = a sub-band of the stroke, cleared from the stroke's start side up to its (lagging, ragged) head
  function fillBristle(ps, j, head) {
    var f0 = j / BRISTLES, f1 = (j + 1) / BRISTLES;
    var pad0 = j === 0 ? 0 : -3, pad1 = j === BRISTLES - 1 ? 0 : 3;
    var x0 = ps.dir > 0 ? XA : XB;
    var steps = Math.max(1, Math.ceil(Math.abs(head - x0) / EDGE_STEP));
    var s, x;
    mctx.beginPath();
    for (s = 0; s <= steps; s++) {
      x = x0 + (head - x0) * (s / steps);
      if (s === 0) mctx.moveTo(x, bandY(ps, x, f0) + pad0);
      else mctx.lineTo(x, bandY(ps, x, f0) + pad0);
    }
    mctx.lineTo(head + ps.tips[j][0] * ps.dir, bandY(ps, head, f0) + pad0);
    mctx.lineTo(head + ps.tips[j][1] * ps.dir, bandY(ps, head, f1) + pad1);
    for (s = steps; s >= 0; s--) {
      x = x0 + (head - x0) * (s / steps);
      mctx.lineTo(x, bandY(ps, x, f1) + pad1);
    }
    mctx.closePath();
    mctx.fill();
  }

  function drawMask(t) {
    mctx.globalCompositeOperation = "source-over";
    mctx.globalAlpha = 1;
    mctx.clearRect(0, 0, MW, MH);
    if (t >= MASK_END) return;
    mctx.drawImage(maskBase, 0, 0);
    mctx.globalCompositeOperation = "destination-out";
    mctx.fillStyle = "#000";
    for (var k = 0; k < PASSES.length; k++) {
      var ps = PASSES[k];
      var raw = (t - ps.start) / ps.dur;
      if (raw <= 0) continue;
      var e = E_P1_INOUT(clamp01(raw));
      for (var j = 0; j < BRISTLES; j++) {
        var h = clamp01((e - ps.lags[j]) / (1 - ps.lags[j]));
        if (h <= 0) continue;
        fillBristle(ps, j, ps.dir > 0 ? XA + (XB - XA) * h : XB - (XB - XA) * h);
      }
    }
    mctx.globalCompositeOperation = "source-over";
  }

  /* ================= odometer columns (vertical ticker, bounce dropped) ================= */
  // Each column = masked window + stack of equal-height items; every step contributes one eased
  // 0→1 unit, the contributions are SUMMED into translateY (steps 0.08 s apart, smooth sine.inOut).
  var ITEM_H = 270, STEP_SPACING = 0.08, STEP_DUR = 0.34, COL_START = 1.58, COL_STAGGER = 0.08;
  var COLS = [1, 7, 4, 8].map(function (target, c) {
    return {
      stacks: [el("f05-return-stack-" + (c + 1)), el("f05-return-gstack-" + (c + 1))],
      steps: target,
      start: COL_START + c * COL_STAGGER
    };
  });
  function renderOdometer(t) {
    for (var c = 0; c < COLS.length; c++) {
      var col = COLS[c], sum = 0;
      for (var i = 0; i < col.steps; i++) sum += seg(t, col.start + i * STEP_SPACING, STEP_DUR, E_SINE_INOUT);
      var tr = "translateY(" + (-sum * ITEM_H).toFixed(3) + "px)";
      col.stacks[0].style.transform = tr;
      col.stacks[1].style.transform = tr;
    }
  }

  /* ================= +100 counter value (same start / duration / ease as its scale tween) ================= */
  var COUNT_AT = 3.78, COUNT_DUR = 0.7;
  var numEl = el("f05-return-num");
  function renderCounter(t) {
    var txt = String(Math.round(100 * seg(t, COUNT_AT, COUNT_DUR, E_P2_OUT)));
    if (numEl.textContent !== txt) numEl.textContent = txt;
  }

  /* ================= multi-phase camera: phase scale + sine drift, one writer ================= */
  var cam = el("f05-return-camera");
  function writeCamera(t) {
    var scale = 1
      + 0.035 * seg(t, 0.2, 2.7, E_P1_INOUT)            // phase 1→2: slow creep in on the buried year
      - 0.035 * seg(t, 3.5, 0.9, E_P3_INOUT)            // phase 3: pull back as the section opens
      + 0.012 * seg(t, 5.14, DUR - 5.14, E_SINE_INOUT); // phase 4: quiet push on the hold
    var p = (t / DUR) * Math.PI * 2 * 1.2;
    var dx = Math.sin(p) * 4;
    var dy = Math.sin(p * 1.3) * 2;
    cam.style.transform = "scale(" + scale.toFixed(5) + ") translate(" + dx.toFixed(3) + "px, " + dy.toFixed(3) + "px)";
  }

  /* single full-duration driver: its own time is always current, so any seek order lands identically */
  function renderAt(t) {
    drawMask(t);
    renderOdometer(t);
    renderCounter(t);
    writeCamera(t);
  }
  var clock = { t: 0 };
  renderAt(0);
  tl.to(clock, {
    t: DUR, duration: DUR, ease: "none", lazy: false,
    onUpdate: function () { renderAt(clock.t); }
  }, 0);

  /* ember excavation line draws on «году» */
  tl.fromTo([el("f05-return-dig"), el("f05-return-dig-glow")],
    { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 2.90);

  /* ================= Scene 3: FLIP up + «+100 ЛЕТ» ================= */
  // first: centre y 720, scale 1 → last: centre y 330, scale 0.62 (relief layer rides along, invisible on the digits)
  tl.fromTo([el("f05-return-yeargroup"), el("f05-return-ghost")],
    { y: 0, scale: 1 }, { y: -390, scale: 0.62, duration: 0.7, ease: "power3.inOut" }, 3.50);

  var countEl = el("f05-return-count");
  tl.fromTo(countEl, { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power1.out" }, COUNT_AT);
  tl.fromTo(countEl, { scale: 0.6 }, { scale: 1, duration: COUNT_DUR, ease: "power2.out" }, COUNT_AT);
  tl.fromTo(el("f05-return-unit"),
    { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.42, ease: "power2.out" }, 4.42);

  /* ================= Scene 4: strata cross-section ================= */
  function waveFn(base, parts) {
    return function (x) {
      var y = base;
      for (var i = 0; i < parts.length; i++) y += parts[i][0] * Math.sin((x / 900) * Math.PI * 2 * parts[i][1] + parts[i][2]);
      return y;
    };
  }
  var B1 = waveFn(150, [[6, 1.15, 0.6], [3, 3.1, 2.1]]);
  var B2 = waveFn(332, [[7, 0.9, 1.9], [3, 2.7, 0.3]]);
  var B3 = waveFn(588, [[6, 1.3, 4.0], [2.5, 3.6, 1.2]]);
  function linePts(fn) {
    var s = "";
    for (var x = 0; x <= 900; x += 10) s += (x === 0 ? "M" : " L") + x + " " + fn(x).toFixed(1);
    return s;
  }
  function bandD(fn) { return "M0 760 L" + linePts(fn).slice(1) + " L900 760 Z"; }
  el("f05-return-band-2").setAttribute("d", bandD(B1));
  el("f05-return-band-3").setAttribute("d", bandD(B2));
  el("f05-return-band-4").setAttribute("d", bandD(B3));
  el("f05-return-seam-1").setAttribute("d", linePts(B1));
  el("f05-return-seam-2").setAttribute("d", linePts(B2));
  el("f05-return-seam-3").setAttribute("d", linePts(B3));

  // abstract voids: convex rounded lenses / pebbles, seeded edge perturbation (geology, never figures)
  var VOIDS = [
    { cx: 470, cy: 80,  w: 124, h: 48, tilt: -4, pinch: 0.20, seed: 11 },
    { cx: 618, cy: 238, w: 178, h: 62, tilt: 3,  pinch: 0.22, seed: 23 },
    { cx: 158, cy: 246, w: 96,  h: 44, tilt: 5,  pinch: 0.05, seed: 37 },
    { cx: 372, cy: 462, w: 220, h: 80, tilt: -2, pinch: 0.18, seed: 41 },
    { cx: 742, cy: 438, w: 134, h: 56, tilt: 6,  pinch: 0.06, seed: 59 }
  ];
  var LARGEST = 3;
  VOIDS.forEach(function (v, i) {
    var r = mulberry32(v.seed);
    var ph1 = r() * 6.2832, ph2 = r() * 6.2832, ph3 = r() * 6.2832;
    var a1 = 0.03 + r() * 0.02, a2 = 0.015 + r() * 0.012, a3 = 0.008 + r() * 0.006;
    var ang = (v.tilt * Math.PI) / 180, ca = Math.cos(ang), sa = Math.sin(ang);
    var A = v.w / 2, B = v.h / 2, N = 72, pts = [];
    var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9, bottomNearCentre = -1e9;
    for (var k = 0; k < N; k++) {
      var th = (k / N) * Math.PI * 2, c = Math.cos(th), s = Math.sin(th);
      var n = a1 * Math.sin(2 * th + ph1) + a2 * Math.sin(3 * th + ph2) + a3 * Math.sin(5 * th + ph3);
      var x = A * c * (1 + n * 0.5);
      var y = B * s * (1 - v.pinch * c * c) * (1 + n);
      var px = x * ca - y * sa, py = x * sa + y * ca;
      pts.push([px, py]);
      if (px < minX) minX = px;
      if (px > maxX) maxX = px;
      if (py < minY) minY = py;
      if (py > maxY) maxY = py;
      if (Math.abs(px) < 14 && py > bottomNearCentre) bottomNearCentre = py;
    }
    var ox = Math.floor(minX) - 1, oy = Math.floor(minY) - 1;
    var d = "";
    pts.forEach(function (p, k2) {
      d += (k2 === 0 ? "M" : " L") + (p[0] - ox).toFixed(1) + " " + (p[1] - oy).toFixed(1);
    });
    d += " Z";
    var node = el("f05-return-void-" + (i + 1));
    node.style.left = v.cx + ox + "px";
    node.style.top = v.cy + oy + "px";
    node.style.width = Math.ceil(maxX) - ox + 1 + "px";
    node.style.height = Math.ceil(maxY) - oy + 1 + "px";
    node.style.clipPath = 'path("' + d + '")';
    v.node = node;
    v.plaster = node.firstElementChild;
    v.bottom = v.cy + bottomNearCentre;
  });

  // leader from the largest void down into the charcoal band, then out to «ГИПС»
  var big = VOIDS[LARGEST];
  var LX = big.cx, LY0 = Math.round(big.bottom + 12), LY1 = 680, LX1 = LX + 60;
  var dot = el("f05-return-leader-dot"), lv = el("f05-return-leader-v"), lh = el("f05-return-leader-h"), label = el("f05-return-label");
  dot.style.left = LX - 4 + "px";
  dot.style.top = LY0 - 4 + "px";
  lv.style.left = LX - 1 + "px";
  lv.style.top = LY0 + "px";
  lv.style.height = LY1 - LY0 + 1 + "px";
  lh.style.left = LX + "px";
  lh.style.top = LY1 - 1 + "px";
  lh.style.width = LX1 - LX + "px";
  label.style.left = LX1 + 14 + "px";
  label.style.top = LY1 - 16 + "px";

  // bands slide out under a top→bottom mask on «археологи»
  tl.fromTo(el("f05-return-strata"),
    { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power2.inOut" }, 4.04);
  tl.fromTo(el("f05-return-strata-inner"),
    { y: -28 }, { y: 0, duration: 0.5, ease: "power2.inOut" }, 4.04);

  // dark voids surface on «начинают», step 0.12 s
  VOIDS.forEach(function (v, i) {
    tl.fromTo(v.node, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 4.63 + i * 0.12);
  });

  /* ================= Scene 5: plaster rises inside each void ================= */
  VOIDS.forEach(function (v, i) {
    tl.fromTo(v.plaster, { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power1.inOut" }, 5.14 + i * 0.15);
  });
  tl.fromTo(dot, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power2.out" }, 5.57);
  tl.fromTo(lv, { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power2.inOut" }, 5.57);
  tl.fromTo(lh, { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power2.out" }, 5.85);
  tl.fromTo(label, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 5.93);

  window.__timelines = window.__timelines || {};
  window.__timelines["05-return"] = tl;
})();
</script>
</template>
