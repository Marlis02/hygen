    <script>
      (function () {
        // vo_cues, seconds from the start of THIS frame (0.00–2.00 is deliberate silence):
        // Треть@2.00 · города@2.22 · не@2.61 · раскопана@2.74 · до@3.30 · сих@3.43 · пор@3.60 · speech ends@3.77

        var stage = document.getElementById("f06-finale-stage");
        var spark = document.getElementById("f06-finale-spark");
        var sparkGlow = document.getElementById("f06-finale-spark-glow");
        var sparkCore = document.getElementById("f06-finale-spark-core");
        var oneBox = document.getElementById("f06-finale-one");
        var oneValue = document.getElementById("f06-finale-one-value");
        var threeBox = document.getElementById("f06-finale-three");
        var threeValue = document.getElementById("f06-finale-three-value");
        var slash = document.getElementById("f06-finale-slash");
        var slashGlow = document.getElementById("f06-finale-slash-glow");
        var seg1 = document.getElementById("f06-finale-seg-1");
        var seg2 = document.getElementById("f06-finale-seg-2");
        var seg3Top = document.getElementById("f06-finale-seg-3-top");
        var seg3Bottom = document.getElementById("f06-finale-seg-3-bottom");
        var label = document.getElementById("f06-finale-label");

        // Stroke length: measured with getTotalLength(); if the element isn't measurable yet,
        // derive the same length from its own geometry (line coordinates or absolute M/L/H/V data).
        function strokeLength(el) {
          var len = 0;
          try {
            len = el.getTotalLength();
          } catch (e) {
            len = 0;
          }
          if (len > 0) return len;
          if (el.tagName.toLowerCase() === "line") {
            return Math.hypot(
              el.x2.baseVal.value - el.x1.baseVal.value,
              el.y2.baseVal.value - el.y1.baseVal.value
            );
          }
          var t = (el.getAttribute("d") || "").trim().split(/[\s,]+/);
          var x = 0, y = 0, i = 0, nx, ny;
          len = 0;
          while (i < t.length) {
            var c = t[i++];
            if (c === "M") { x = +t[i++]; y = +t[i++]; }
            else if (c === "L") { nx = +t[i++]; ny = +t[i++]; len += Math.hypot(nx - x, ny - y); x = nx; y = ny; }
            else if (c === "H") { nx = +t[i++]; len += Math.abs(nx - x); x = nx; }
            else if (c === "V") { ny = +t[i++]; len += Math.abs(ny - y); y = ny; }
          }
          return len;
        }

        // One dash the length of the path (+ a slightly longer gap so an undrawn stroke leaves no seam).
        function prepDraw(el, len) {
          el.style.strokeDasharray = len + " " + (len + 8);
          el.style.strokeDashoffset = String(len);
        }

        var slashLen = strokeLength(slash);
        var seg3TopLen = strokeLength(seg3Top);
        var seg3BottomLen = strokeLength(seg3Bottom);
        prepDraw(slash, slashLen);
        prepDraw(slashGlow, slashLen);
        prepDraw(seg3Top, seg3TopLen);
        prepDraw(seg3Bottom, seg3BottomLen);

        var tl = gsap.timeline({ paused: true });

        // ── Scene 1 (0.00–2.00): black silence. One ember-deep spark smoulders out by 1.90 ──
        tl.fromTo(spark, { y: 0, scale: 1 }, { y: -12, scale: 0.6, duration: 1.9, ease: "sine.inOut" }, 0);
        tl.fromTo(sparkCore, { opacity: 1 }, { opacity: 0, duration: 1.9, ease: "power2.in" }, 0);
        // the glow breathes down unevenly (hand-set, deterministic values), then dies with the core
        tl.fromTo(sparkGlow, { opacity: 1 }, { opacity: 0.5, duration: 0.5, ease: "sine.inOut" }, 0);
        tl.to(sparkGlow, { opacity: 0.85, duration: 0.35, ease: "sine.inOut" }, 0.5);
        tl.to(sparkGlow, { opacity: 0.35, duration: 0.45, ease: "sine.inOut" }, 0.85);
        tl.to(sparkGlow, { opacity: 0.5, duration: 0.25, ease: "sine.inOut" }, 1.3);
        tl.to(sparkGlow, { opacity: 0, duration: 0.35, ease: "power2.in" }, 1.55);

        // ── Scene 2 (2.00–2.75): the fraction ──
        // «Треть» 2.00: "1" counts 0 → 1; value and scale 0.8 → 1 share one tween (same timing + ease)
        tl.fromTo(
          oneValue,
          { textContent: 0, scale: 0.8 },
          { textContent: 1, scale: 1, snap: { textContent: 1 }, duration: 0.35, ease: "power3.out" },
          2.0
        );
        tl.fromTo(oneBox, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, 2.0);
        // «города» 2.22: the ember fraction bar draws bottom → top (its glow draws with it)
        tl.fromTo(slash, { strokeDashoffset: slashLen }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 2.22);
        tl.fromTo(slashGlow, { strokeDashoffset: slashLen }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 2.22);
        // 2.35 → 2.75: "3" counts 0 → 3
        tl.fromTo(
          threeValue,
          { textContent: 0, scale: 0.8 },
          { textContent: 3, scale: 1, snap: { textContent: 1 }, duration: 0.4, ease: "power3.out" },
          2.35
        );
        tl.fromTo(threeBox, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, 2.35);

        // ── Scene 3 (2.74–3.60): the three-segment scale ──
        // «раскопана» 2.74: the first two segments fill left → right
        tl.fromTo(seg1, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 2.74);
        tl.fromTo(seg2, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 2.84);
        // «до сих» 3.30: the third segment draws as an empty ember outline (both halves sweep left → right)
        tl.fromTo(seg3Top, { strokeDashoffset: seg3TopLen }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 3.3);
        tl.fromTo(seg3Bottom, { strokeDashoffset: seg3BottomLen }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 3.3);
        // «пор» 3.60: НЕ РАСКОПАНО
        tl.fromTo(label, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power1.out" }, 3.6);

        // ── Scene 4 (3.77–4.92): still hold of the final card. Nothing moves; only the ember glow cools slightly ──
        tl.to(slashGlow, { opacity: 0.55, duration: 1.1, ease: "sine.inOut" }, 3.8);

        // ── Scene 5 (4.92–5.367): final frame, all content fades to clean night ──
        tl.to(stage, { opacity: 0, duration: 0.447, ease: "power2.in" }, 4.92);

        window.__timelines = window.__timelines || {};
        window.__timelines["06-finale"] = tl;
      })();
    </script>
